              ${period?`<td class="num">${r.nguoiBq?r.nguoiBq.toFixed(1):'—'}</td><td class="num">${r.thuNhapNguoi?vndShort(r.thuNhapNguoi):'—'}</td>`:''}
              <td class="num">${vndShort(r.daUng)}</td>
              <td class="num" title="Công nhật được hưởng ${vndShort(r.ktCong)} − bị khấu trừ ${vndShort(r.ktTru)} − phạt ${vndShort(r.phatLk)}">${r.dieuChinh?vndShort(r.dieuChinh):'0'}</td>
              <td class="num" style="font-weight:800; color:${r.conDuocUng<0?'#f87171':'#4ade80'};">${vndShort(r.conDuocUng)}${r.conDuocUng<0?' <span class="chip chip-danger">Ứng vượt</span>':''}</td>

function recentPeriods(){
  const out = []; const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+1);
  for(let i=0;i<24;i++){ out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); d.setMonth(d.getMonth()-1); }
  return out;
}
function billItemAmount(it){ const q = Number(it.qty)||0, p = Number(it.price)||0; return (q && p) ? Math.round(q*p) : (Number(it.amount)||0); }
function billTotal(items){ return (items||[]).reduce((s,it)=>s+billItemAmount(it), 0); }
function payBillOpen(id){
  const b = id ? payLoad().bills.find(x=>x.id===id) : null;
  state.edit.pay_bill = id || null; state.formOpen.pay_bill = true; state.billImport = null; state.err.bill = null;
  state.billDraft = b ? { team:b.team, leader:b.leader, category:b.category, ky:b.ky, period:b.period, periodFrom:b.periodFrom, date:b.date, note:b.note, fileName:b.fileName, items:b.items.map(x=>({...x})) }
                      : { team:'', leader:'', category:'', ky:'', period:'', periodFrom:'', date:'', note:'', fileName:'', items:[{name:'',unit:'',qty:'',price:'',amount:''}] };
  render();
}
/* ô nhập trong bảng hạng mục: cập nhật nháp + thành tiền/tổng trực tiếp trên DOM (không vẽ lại cả trang để giữ con trỏ đang gõ) */
function billItemInput(i, field, el){
  const d = state.billDraft; if(!d || !d.items[i]) return;
  let v = el.value;
  if(field==='qty' || field==='price' || field==='amount'){ v = v.replace(/[^\d.,]/g,''); if(field!=='qty'){ onMoneyInput(el); v = parseMoney(el.value); } else { v = Number(String(v).replace(',','.'))||''; } }
  d.items[i][field] = v;
  const amtEl = document.getElementById('billAmt'+i);
  if(amtEl && field!=='amount') amtEl.value = formatThousands(billItemAmount(d.items[i]));
  const totEl = document.getElementById('billTotal');
  if(totEl) totEl.textContent = vndShort(billTotal(d.items)) + ' đ';
}
function billDraftField(field, el){ if(state.billDraft) state.billDraft[field] = el.value; }
function billAddRow(){ syncBillHeaderFromForm(); state.billDraft.items.push({name:'',unit:'',qty:'',price:'',amount:''}); render(); }
function billRemoveRow(i){ syncBillHeaderFromForm(); state.billDraft.items.splice(i,1); if(!state.billDraft.items.length) state.billDraft.items.push({name:'',unit:'',qty:'',price:'',amount:''}); render(); }
function syncBillHeaderFromForm(){
  const f = document.getElementById('billForm'); if(!f || !state.billDraft) return;
  state.billDraft.team = f.team.value; state.billDraft.period = f.period.value;
  state.billDraft.periodFrom = f.periodFrom.value; state.billDraft.ky = f.ky.value;
  state.billDraft.category = f.category.value; state.billDraft.leader = f.leader.value;
  state.billDraft.date = f.date.value && isValidDmy(f.date.value) ? normalizeDate(f.date.value) : state.billDraft.date;
  state.billDraft.note = f.note.value;
}
function payBillSave(e){
  e.preventDefault();
  syncBillHeaderFromForm();
  const d = state.billDraft;
  const team = String(d.team||'').trim();
  const items = d.items.filter(it => String(it.name||'').trim() || billItemAmount(it)).map(it => ({
    name:String(it.name||'').trim(), unit:String(it.unit||'').trim(), qty:Number(it.qty)||0, price:Number(it.price)||0, amount:billItemAmount(it) }));
  if(!team){ state.err.bill='Chọn hoặc nhập tên tổ đội.'; render(); return false; }
  if(!/^\d{4}-\d{2}$/.test(d.period||'')){ state.err.bill='Chọn tháng kết thúc của kỳ.'; render(); return false; }
  const periodFrom = /^\d{4}-\d{2}$/.test(d.periodFrom||'') ? d.periodFrom : d.period;
  if(periodFrom > d.period){ state.err.bill='"Từ tháng" phải trước hoặc bằng tháng kết thúc kỳ.'; render(); return false; }
  if(!items.length){ state.err.bill='Bill chưa có hạng mục nào có giá trị.'; render(); return false; }
  const pay = payLoad();
  const pid = currentProjectId();
  const dup = pay.bills.find(b => rowProjectId(b)===pid && b.team===team && b.period===d.period && b.id!==state.edit.pay_bill);
  if(dup && !state.billDupOk){ state.billDupOk = true; state.err.bill='Tổ "'+team+'" đã có bill '+periodLabel(d.period)+' ('+vndShort(dup.total)+' đ). Bấm Lưu lần nữa nếu đây là bill bổ sung.'; render(); return false; }
  state.billDupOk = false;
  const rec = { id: state.edit.pay_bill || payUid(pay.bills), projectId:pid, team, period:d.period, periodFrom,
    ky:String(d.ky||'').trim(), category:String(d.category||'').trim(), leader:String(d.leader||'').trim(), date:d.date||'', items,
    total: billTotal(items), note:String(d.note||'').trim(), fileName:d.fileName||'', createdBy: currentActorName() };
  const idx = pay.bills.findIndex(b=>b.id===rec.id);
  if(idx===-1) pay.bills.push(rec); else pay.bills[idx] = rec;
  paySave(pay);
  syncWrite('saveBill', { data: {...rec, items: JSON.stringify(items)} });
  state.formOpen.pay_bill=false; state.edit.pay_bill=null; state.billDraft=null; state.billImport=null; state.err.bill=null;
  render();
  return false;
}
function payBillDelete(id){
  const pay = payLoad(); const b = pay.bills.find(x=>x.id===id);
  pay.bills = pay.bills.filter(x=>x.id!==id); paySave(pay);
  syncWrite('deleteBill', { id, projectId: b ? rowProjectId(b) : currentProjectId() });
  state.confirmId=null; render();
}
function payBillToggle(id){ state.billExpanded = state.billExpanded===id ? null : id; render(); }

/* ---- nhập bill từ Excel: tự nhận diện hàng tiêu đề + cột, cho người dùng chỉnh lại trước khi dùng ---- */
let XLSX_LOADING = null;
function loadSheetJs(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(XLSX_LOADING) return XLSX_LOADING;
  XLSX_LOADING = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve(window.XLSX);
    s.onerror = () => { XLSX_LOADING = null; reject(new Error('Không tải được thư viện đọc Excel (kiểm tra mạng).')); };
    document.head.appendChild(s);
  });
  return XLSX_LOADING;
}
const BILL_FIELDS = [
  { key:'name',   label:'Tên công việc', re:/(nội\s*dung|hạng\s*mục|tên\s*công\s*việc|công\s*việc|diễn\s*giải|tên\s*việc)/i },
  { key:'unit',   label:'Đơn vị',        re:/(đơn\s*vị|đvt|\bđv\b)/i },
  { key:'qty',    label:'Khối lượng',    re:/(khối\s*lượng|\bkl\b|số\s*lượng)/i },
  { key:'price',  label:'Đơn giá',       re:/(đơn\s*giá)/i },
  { key:'amount', label:'Thành tiền',    re:/(thành\s*tiền|giá\s*trị|thanh\s*toán)/i }
];
function xlsNum(v){
  if(typeof v==='number') return v;
  const s = String(v==null?'':v).trim(); if(!s) return 0;
  // "1.234.567" hoặc "1,234,567" -> 1234567 ; "12,5" -> 12.5
  if(/^\d{1,3}([.,]\d{3})+$/.test(s)) return Number(s.replace(/[.,]/g,''));
  return Number(s.replace(/\s/g,'').replace(',','.')) || 0;
}
function detectBillLayout(rows){
  let best = { row:-1, score:0, map:{} };
  for(let r=0; r<Math.min(rows.length, 40); r++){
    const cells = (rows[r]||[]).map(c => String(c==null?'':c));
    const map = {}; let score = 0;
    BILL_FIELDS.forEach(f => {
      // ưu tiên cột "kỳ này" nếu có nhiều cột khối lượng/thành tiền (VD: "KL kỳ này", "KL lũy kế")
      const hits = cells.map((c,i)=>({c,i})).filter(x => f.re.test(x.c));
      if(!hits.length) return;
      const pref = hits.find(x => /kỳ\s*này|đợt\s*này|thực\s*hiện/i.test(x.c)) || hits.find(x => !/lũy\s*kế|luỹ\s*kế|kỳ\s*trước|hợp\s*đồng/i.test(x.c)) || hits[0];
      map[f.key] = pref.i; score++;
    });
    if(score > best.score){ best = { row:r, score, map }; }
  }
  // tiêu đề 2 tầng (VD hàng trên "Khối lượng", hàng dưới "Kỳ này") — thử ghép thêm hàng ngay dưới
  return best;
}
function parseBillRows(rows, layout){
  const m = layout.map; const items = []; let fileTotal = null; let blank = 0;
  for(let r = layout.row+1; r < rows.length; r++){
    const row = rows[r] || [];
    const get = k => m[k]!=null && m[k]!=='' ? row[Number(m[k])] : '';
    const name = String(get('name')==null?'':get('name')).trim();
    const qty = xlsNum(get('qty')), price = xlsNum(get('price')), amount = xlsNum(get('amount'));
    if(!name && !qty && !price && !amount){ if(++blank>=5) break; continue; }
    blank = 0;
    if(/^(tổng\s*cộng|cộng|tổng|tổng\s*số)\b/i.test(name)){ fileTotal = amount || null; break; }
    if(!amount && !(qty && price)) continue; // dòng tiêu đề nhóm / dòng trống số liệu
    items.push({ name, unit:String(get('unit')==null?'':get('unit')).trim(), qty, price, amount: (qty&&price) ? Math.round(qty*price) : amount });
  }
  return { items, fileTotal };
}
async function billImportFile(e){
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if(!file) return;
  syncBillHeaderFromForm();
  state.err.bill = null; state.billImport = { loading:true, fileName:file.name }; render();
  try{
    const XLSX = await loadSheetJs();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array' });
    const sheetName = wb.SheetNames[0];
    const sheets = {}; wb.SheetNames.forEach(n => { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:'' }); });
    const rows = sheets[sheetName];
    const layout = detectBillLayout(rows);
    state.billImport = { fileName:file.name, sheetNames:wb.SheetNames, sheets, sheet:sheetName, layout };
  }catch(err){
    state.billImport = null; state.err.bill = 'Không đọc được file: ' + err.message;
  }
  render();
}
function billImportSet(field, value){
  const bi = state.billImport; if(!bi) return;
  syncBillHeaderFromForm();
  if(field==='sheet'){ bi.sheet = value; bi.layout = detectBillLayout(bi.sheets[value]); }
  else if(field==='row'){ bi.layout.row = Math.max(0, Number(value)-1); }
  else { bi.layout.map[field] = value==='' ? '' : Number(value); }
  render();
}
function billImportApply(){
  const bi = state.billImport; if(!bi) return;
  syncBillHeaderFromForm();
  const res = parseBillRows(bi.sheets[bi.sheet], bi.layout);
  if(!res.items.length){ state.err.bill='Không lấy được hạng mục nào — kiểm tra lại hàng tiêu đề và các cột.'; render(); return; }
  state.billDraft.items = res.items; state.billDraft.fileName = bi.fileName;
  state.billImport = null; state.err.bill = null; render();
}
function colLetter(i){ let s=''; i=Number(i); do{ s = String.fromCharCode(65 + i%26) + s; i = Math.floor(i/26)-1; }while(i>=0); return s; }
function renderBillImportPanel(){
  const bi = state.billImport;
  if(bi.loading) return `<div class="hint-box" style="margin-top:12px;">Đang đọc file ${esc(bi.fileName)}...</div>`;
  const rows = bi.sheets[bi.sheet] || [];

    </select>`;
  return `

      <div class="card-head"><h3>Nhập từ Excel: ${esc(bi.fileName)}</h3><button class="link-btn" type="button" onclick="state.billImport=null; render();">Huỷ</button></div>
      <div class="card-body">
        <div class="formrow3">
          ${bi.sheetNames.length>1?`<div class="field"><label>Sheet</label><select onchange="billImportSet('sheet', this.value)">${bi.sheetNames.map(n=>`<option ${n===bi.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`:''}
          <div class="field"><label>Hàng tiêu đề (số hàng trong Excel)</label><input type="number" min="1" value="${bi.layout.row+1}" onchange="billImportSet('row', this.value)"></div>
        </div>
        <div class="formrow3" style="margin-top:10px;">${BILL_FIELDS.map(f=>`<div class="field"><label>Cột ${f.label}</label>${sel(f.key)}</div>`).join('')}</div>
        <div style="margin-top:12px; font-size:12.5px; color:var(--muted);">Xem trước: <b style="color:var(--ink);">${res.items.length} hạng mục</b> · tổng <b style="color:var(--ink);">${vndShort(total)} đ</b>
          ${res.fileTotal!=null?` · dòng "Tổng cộng" trong file: <b style="color:${Math.abs(res.fileTotal-total)<1000?'#4ade80':'#f87171'};">${vndShort(res.fileTotal)} đ</b>${Math.abs(res.fileTotal-total)<1000?' ✓ khớp':' — CHƯA khớp, kiểm tra lại cột'}`:''}</div>
        <div class="tablewrap" style="margin-top:8px; max-height:260px; overflow:auto;"><table>
          <thead><tr><th>Tên công việc</th><th>ĐV</th><th class="num">KL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr></thead>
          <tbody>${res.items.slice(0,30).map(it=>`<tr><td>${esc(it.name)}</td><td>${esc(it.unit)}</td><td class="num">${it.qty||''}</td><td class="num">${it.price?vndShort(it.price):''}</td><td class="num">${vndShort(it.amount)}</td></tr>`).join('') || `<tr class="empty-row"><td colspan="5">Chưa lấy được dòng nào.</td></tr>`}</tbody>
        </table></div>
        <button class="btn btn-accent" type="button" style="margin-top:12px;" onclick="billImportApply()">Dùng ${res.items.length} hạng mục này</button>
      </div>
    </div>`;

/* ---- Tạm ứng ---- */
function advLimitFor(team){
  const r = teamPaySummary('').find(x=>x.team===team);
  return r ? r.conDuocUng + (state.edit.pay_adv ? ((payLoad().advances.find(a=>a.id===state.edit.pay_adv)||{}).amount||0) : 0) : 0;
}
function advHint(){
  const f = document.getElementById('advForm'); const el = document.getElementById('advHint');
  if(!f || !el) return;
  const team = f.team.value.trim();
  if(!team){ el.innerHTML=''; return; }
  const lim = advLimitFor(team);
  const amt = parseMoney(f.amount.value);
  el.innerHTML = `Còn được ứng của <b>${esc(team)}</b>: <b style="color:${lim<0?'#f87171':'#4ade80'};">${vndShort(lim)} đ</b>` +
    (amt && amt>lim ? ` — <b style="color:#f87171;">khoản này vượt hạn mức ${vndShort(amt-lim)} đ</b>` : '');
}
function payAdvSave(e){
  e.preventDefault();
  const f = e.target;
  const team = f.team.value.trim(); const amount = parseMoney(f.amount.value);
  if(!team){ state.err.adv='Chọn tổ đội.'; render(); return false; }
  if(!amount){ state.err.adv='Nhập số tiền tạm ứng.'; render(); return false; }
  if(!isValidDmy(f.date.value)){ state.err.adv='Ngày không hợp lệ.'; render(); return false; }
  const pay = payLoad(); const pid = currentProjectId();
  const rec = { id: state.edit.pay_adv || payUid(pay.advances), projectId:pid, team, date:normalizeDate(f.date.value), amount,
    note:f.note.value.trim(), reportedBy: currentActorName() };
  const idx = pay.advances.findIndex(a=>a.id===rec.id);
  if(idx===-1) pay.advances.push(rec); else pay.advances[idx] = rec;
  paySave(pay);
  syncWrite('saveTamUng', { data: rec });
  state.formOpen.pay_adv=false; state.edit.pay_adv=null; state.err.adv=null; render();
  return false;
}
function payAdvEdit(id){ state.edit.pay_adv=id; state.formOpen.pay_adv=true; state.err.adv=null; render(); }
function payAdvDelete(id){
  const pay = payLoad(); const a = pay.advances.find(x=>x.id===id);
  pay.advances = pay.advances.filter(x=>x.id!==id); paySave(pay);
  syncWrite('deleteTamUng', { id, projectId: a ? rowProjectId(a) : currentProjectId() });
  state.confirmId=null; render();
}

/* =====================================================================
   CẢNH BÁO KHO (theo công trình đang chọn): âm kho, dưới mức tối thiểu (cài theo từng
   vật tư, lưu ở cột khoMin của tab CongTrinh), xuất bất thường trong 7 ngày gần nhất
   (một lần xuất lớn hơn 3 lần mức xuất thường của vật tư đó).
   ===================================================================== */
function khoMinOf(p){ try{ const o = JSON.parse((p && p.khoMin) || '{}'); return (o && typeof o==='object') ? o : {}; }catch(e){ return {}; } }
function khoAlerts(){
  const out = [];
  const mins = khoMinOf(currentProject());
  const chinh = load(LS.vatTuChinh, []);
  khoStockSummary(chinh, 'material').forEach(m => {
    const min = mins[m.name];
    if(m.ton < 0) out.push({ level:'danger', name:m.name, text:`Âm kho ${vndShort(m.ton)} ${m.unit} — kiểm tra phiếu nhập/xuất` });
    else if(min!=null && min!=='' && m.ton < Number(min)) out.push({ level:'warn', name:m.name, text:`Còn ${vndShort(m.ton)} ${m.unit}, dưới mức tối thiểu ${vndShort(min)}` });
  });
  khoStockSummary(load(LS.vatTuPhu, []), 'itemName').forEach(m => {
    if(m.ton < 0) out.push({ level:'danger', name:m.name, text:`Vật tư phụ âm kho ${vndShort(m.ton)} ${m.unit}` });
  });
  const cutoff = new Date(Date.now() - 7*86400000).toISOString().slice(0,10);
  const xuat = chinh.filter(r=>r.direction==='xuat' && r.quantity>0);
  xuat.filter(r=>r.date>=cutoff).forEach(r => {
    const prev = xuat.filter(x=>x.material===r.material && x.id!==r.id && (x.date<r.date || (x.date===r.date && x.id<r.id)));
    if(prev.length < 3) return;
    const med = median(prev.map(x=>x.quantity));
    if(med && r.quantity > 3*med) out.push({ level:'warn', name:r.material, text:`Xuất bất thường ${vndShort(r.quantity)} ${r.unit} cho ${r.team||'(không rõ tổ)'} ngày ${vdate(r.date)} — gấp ${(r.quantity/med).toFixed(1)} lần mức thường` });
  });
  return out;
}
function saveKhoMins(e){
  e.preventDefault();
  const p = currentProject(); if(!p) return false;
  const mins = {};
  e.target.querySelectorAll('input[data-mat]').forEach(el => { const v = el.value.trim(); if(v!=='') mins[el.dataset.mat] = Number(v.replace(/[^\d.]/g,''))||0; });
  saveProject({ ...p, khoMin: JSON.stringify(mins) });
  state.khoMinOpen = false;
  render();
  return false;
}
function renderKhoAlertsCard(){
  const alerts = khoAlerts();
  const stock = khoStockSummary(load(LS.vatTuChinh, []), 'material').sort((a,b)=>a.name.localeCompare(b.name));
  const mins = khoMinOf(currentProject());
  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>Cảnh báo kho</h3>${canEdit('kho')?`<button class="link-btn" onclick="state.khoMinOpen=!state.khoMinOpen; render();">${state.khoMinOpen?'Đóng':'Cài mức tồn tối thiểu'}</button>`:''}</div>
      <div class="card-body">
        ${alerts.length===0?`<div style="color:#4ade80; font-size:13px;">✓ Không có cảnh báo nào.</div>`:
          alerts.map(a=>`<div class="notif-row" style="padding:7px 0;"><span><span class="chip ${a.level==='danger'?'chip-danger':'chip-progress'}">${a.level==='danger'?'Nghiêm trọng':'Chú ý'}</span> <b>${esc(a.name)}</b></span><span style="color:var(--muted); text-align:right;">${esc(a.text)}</span></div>`).join('')}
        ${state.khoMinOpen?`
        <form onsubmit="return saveKhoMins(event)" style="margin-top:14px;">
          <div class="tablewrap"><table>
            <thead><tr><th>Vật tư</th><th class="num">Tồn hiện tại</th><th class="num">Mức tối thiểu</th></tr></thead>
            <tbody>${stock.length===0?`<tr class="empty-row"><td colspan="3">Chưa có vật tư nào.</td></tr>`:stock.map(m=>`<tr>
              <td>${esc(m.name)}</td><td class="num">${vndShort(m.ton)} ${esc(m.unit)}</td>
              <td class="num"><input data-mat="${esc(m.name)}" inputmode="decimal" style="width:110px; text-align:right;" value="${mins[m.name]!=null?mins[m.name]:''}" placeholder="bỏ trống = không cảnh báo"></td>
            </tr>`).join('')}</tbody>
          </table></div>
          <button class="btn btn-accent" type="submit" style="margin-top:10px;">Lưu mức tối thiểu</button>
          <span style="font-size:12px; color:var(--muted); margin-left:8px;">Áp dụng riêng cho công trình đang chọn.</span>
        </form>`:''}
      </div>
    </div>`;
}

/* ---------- router / render ---------- */
function render(){
  renderChrome();
  document.getElementById('page').classList.remove('page-home');
  if(state.view==='home') return renderHome();
  if(state.view==='noi_quy') return renderNoiQuy();
  if(state.view==='admin'){
    const s=getSession();
    if(!s || s.role!=='admin'){ state.view='home'; return renderHome(); }
    return renderAdmin();
  }
  if(state.view==='doi_mat_khau'){
    const s=getSession();
    if(!s){ state.view='home'; return renderHome(); }
    return renderChangePassword();
  }
  if(state.view==='thanh_toan'){
    if(!isAdminSession()){
      if(!state.err.denied && getSession()) state.err.denied = 'Mục này chỉ dành cho Quản trị viên.';
      return renderGate('thanh_toan');
    }
    return renderThanhToan();
  }
  if(['tai_chinh','kho','thi_cong','nhansu_ct','nhansu_td'].includes(state.view)){
    if(!canAccess(state.view)) return renderGate(state.view);
    if(state.view==='tai_chinh') return renderFinance();
    if(state.view==='kho') return renderKho();
    if(state.view==='thi_cong') return renderThiCong();
    if(state.view==='nhansu_ct') return renderNhanSuCT();
    if(state.view==='nhansu_td') return renderNhanSuTD();
  }
}
