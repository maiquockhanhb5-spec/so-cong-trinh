<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tuấn Tú Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0e16;
    --sidebar-bg:#0c1019;
    --surface:#121722;
    --surface-2:#171e2b;
    --surface-3:#1d2536;
    --ink:#eef2f7;
    --muted:#8792a3;
    --muted-2:#5b6577;
    --line:rgba(255,255,255,.08);
    --accent:#3b82f6;
    --accent-ink:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.6);
    --radius:14px;
    --accent-2:#06b6d4;
    --accent-2-soft:rgba(6,182,212,.15);
    --glow-cyan:0 10px 30px -5px rgba(6,182,212,.18);
    --glass-bg:rgba(12,21,43,.92);
    --glass-blur:blur(14px);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .label-mono{font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.18em; font-weight:700; font-size:11.5px; color:var(--accent-2); text-shadow:0 2px 6px rgba(6,182,212,.25);}
  h1,h2,h3{text-wrap:balance; margin:0; font-weight:700;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- shell ---------- */
  .app-shell{display:flex; min-height:100vh;}
  .sidebar{
    width:258px; flex:none; background:var(--sidebar-bg); border-right:1px solid rgba(6,182,212,.12);
    display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}

  .brand{display:flex; align-items:center; gap:11px; padding:6px 8px 22px;}
  .brand-badge{width:38px; height:38px; border-radius:11px; background:#fff; display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 4px 14px -4px rgba(0,0,0,.4); padding:6px;}
  .brand-badge img{width:100%; height:100%; object-fit:contain; display:block;}
  .brand-name{font-weight:800; font-size:15.5px; color:#fff; letter-spacing:.2px;}
  .brand-sub{font-size:11px; color:var(--muted); margin-top:-1px;}

  .sidebar-nav{display:flex; flex-direction:column; gap:2px;}
  .navitem{display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:10px; color:var(--muted); font-size:13.5px; font-weight:600; width:100%; text-align:left; background:transparent; border:none; transition:background-color .16s ease, color .16s ease, transform .16s ease;}
  .navitem:active{transform:scale(.97);}
  .navitem svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none;}
  .navitem span{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .navitem:hover{background:var(--surface-2); color:var(--ink); transform:translateX(3px);}
  .navitem.active{background:var(--surface-3); color:#fff; box-shadow:0 0 0 1px rgba(6,182,212,.25) inset; border-left:2px solid var(--accent-2); padding-left:9px;}
  .navitem .lock{width:12px; height:12px; opacity:.55; flex:none;}
  .sidebar-spacer{flex:1;}

  .sync-status{display:flex; align-items:center; gap:7px; padding:8px 7px 8px 11px; margin-top:6px; font-size:11.5px; color:var(--muted); background:rgba(255,255,255,.04); border:1px solid rgba(6,182,212,.2); backdrop-filter:blur(6px); border-radius:999px;}
  .sync-label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sync-dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--muted-2);}
  .sync-refresh{background:none; border:none; color:var(--muted); padding:5px; border-radius:7px; display:flex; flex:none; transition:transform .5s ease, background-color .16s ease, color .16s ease;}
  .sync-refresh svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2;}
  .sync-refresh:hover{background:var(--surface-2); color:var(--ink);}
  .sync-refresh:active svg{transform:rotate(180deg);}
  .sync-refresh[disabled]{opacity:.5; cursor:default;}
  .sync-refresh[disabled] svg{animation:syncSpin .8s linear infinite;}
  @keyframes syncSpin{ to{ transform:rotate(360deg); } }
  .sync-dot.syncing{background:#f59e0b; animation:syncPulse 1s ease-in-out infinite;}
  .sync-dot.online{background:#22c55e;}
  .sync-dot.offline{background:#ef4444;}
  @keyframes syncPulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .sidebar-user{display:flex; align-items:center; gap:10px; padding:12px 9px 4px; border-top:1px solid var(--line); margin-top:10px;}
  .avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#8b5cf6); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; color:#fff; flex:none;}
  .sidebar-user .info{flex:1; min-width:0;}
  .sidebar-user .info b{display:block; font-size:13px; color:var(--ink); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar-user .info span{font-size:11.5px; color:var(--muted);}
  .sidebar-user button{background:none; border:none; color:var(--muted); padding:7px; border-radius:8px; flex:none; display:flex; transition:transform .14s ease, background-color .14s ease, color .14s ease;}
  .sidebar-user button:hover{background:var(--surface-2); color:var(--ink); transform:scale(1.1);}

  /* ---------- topbar ---------- */
  .topbar{position:sticky; top:0; z-index:15; background:var(--glass-bg); backdrop-filter:var(--glass-blur); border-bottom:1px solid rgba(6,182,212,.15); box-shadow:var(--glow-cyan); padding:14px 26px; display:flex; align-items:center; gap:16px;}
  .search-box{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 13px; width:100%; max-width:320px; color:var(--muted);}
  .search-box:has(input:disabled){opacity:.5;}
  .search-box svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none;}
  .search-box input{background:none; border:none; outline:none; color:var(--ink); font-size:13.5px; width:100%; font-family:inherit;}
  .search-box input::placeholder{color:var(--muted-2);}
  .topbar-right{margin-left:auto; display:flex; align-items:center; gap:12px;}
  #notifWrap{position:relative;}
  .bell{position:relative; width:38px; height:38px; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); transition:transform .16s ease, color .16s ease, border-color .16s ease;}
  .bell:hover{color:var(--ink); border-color:var(--muted-2); transform:translateY(-2px);}
  .bell .badge{position:absolute; top:-5px; right:-5px; background:#ef4444; color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 4px; border:2px solid var(--bg);}
  .notif-panel{position:absolute; top:48px; right:0; width:270px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:8px; z-index:30;}
  .notif-head{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; padding:6px 8px;}
  .notif-row{display:flex; justify-content:space-between; gap:10px; padding:7px 8px; border-radius:8px; font-size:12.5px;}
  .notif-row:hover{background:var(--surface-2);}
  .notif-row b{color:#f87171;}
  .notif-empty{padding:10px 8px; font-size:12.5px; color:var(--muted);}

  .btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:9px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:transform .14s ease, border-color .14s ease, filter .14s ease;}
  .btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-accent{border-radius:999px; background:linear-gradient(180deg,#1a3875,#0d1632); border:1px solid rgba(6,182,212,.5); color:var(--accent-ink); box-shadow:0 6px 18px rgba(6,182,212,.35), inset 0 1.5px 1.5px rgba(255,255,255,.2), 0 -1px 0 1px rgba(6,182,212,.25); font-weight:800; text-transform:uppercase; letter-spacing:.03em; transition:transform .2s ease, box-shadow .2s ease;}
  .btn-accent:hover{transform:translateY(-1px); box-shadow:0 9px 22px rgba(6,182,212,.5), inset 0 1.5px 1.5px rgba(255,255,255,.25), 0 -1px 0 1px rgba(6,182,212,.35);}
  .btn-accent:active{transform:scale(.97);}

  .page{max-width:1280px; padding:26px 26px 64px;}
  @keyframes pageEnter{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .page.anim{ animation:pageEnter .32s cubic-bezier(.22,.61,.36,1); }
  @media (prefers-reduced-motion: reduce){ .page.anim{ animation:none; } }
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
  .subtab-bar{display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--line); overflow-x:auto;}
  .subtab{padding:11px 14px; margin-bottom:-1px; background:none; border:none; border-bottom:2px solid transparent; color:var(--muted); font-weight:600; font-size:13.5px; white-space:nowrap; transition:color .14s ease, border-color .14s ease;}
  .subtab:hover{color:var(--ink);}
  .subtab.active{color:#fff; border-bottom-color:var(--subtab-c,var(--accent));}

  .kpi-grid.cols-5{grid-template-columns:repeat(5,1fr);}
  @media (max-width:1280px){ .kpi-grid.cols-5{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:560px){ .kpi-grid.cols-5{grid-template-columns:1fr;} }

  .tq-filterbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 18px; margin-bottom:20px;}
  .period-toggle{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; flex:none;}
  .period-toggle button{padding:7px 13px; border-radius:7px; background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:600; transition:background-color .14s ease, color .14s ease;}
  .period-toggle button.active{background:var(--surface-3); color:#fff;}
  .period-toggle button:hover{color:var(--ink);}
  .tq-range{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
  .tq-range input[type=date]{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:7px 9px; font-size:12.5px; font-family:inherit;}
  .tq-loc{margin-left:auto; display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--muted);}
  .tq-loc b{color:var(--ink);}
  .tq-loc input[type=text]{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:6px 9px; font-size:12.5px; font-family:inherit;}
  .worklog-item{padding:13px 0; border-bottom:1px solid var(--line);}
  .worklog-item:last-child{border-bottom:none;}
  .worklog-head{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap;}
  .worklog-date{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px;}
  .worklog-text{font-size:13px; color:#c3cbda; line-height:1.6; white-space:pre-line;}
  .section-head h1{font-size:23px;}
  .section-head p{color:var(--muted); font-size:13.5px; margin-top:4px;}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block;}

  /* ---------- kpi gradient cards ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
  .kpi-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:1080px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .kpi-grid{grid-template-columns:1fr;} }
  .kpi-card{position:relative; overflow:hidden; border-radius:16px; padding:18px 20px 56px; min-height:120px; color:#fff; display:flex; flex-direction:column; gap:8px; border:1px solid rgba(255,255,255,.08); transition:transform .16s ease, box-shadow .16s ease;}
  .kpi-card:hover{transform:translateY(-3px); box-shadow:0 16px 34px -12px var(--kpi-glow, rgba(0,0,0,.55));}
  .kpi-card::before{content:'';position:absolute; inset:0; background:radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,.18), transparent 60%); pointer-events:none;}
  .kpi-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:relative; z-index:1;}
  .kpi-label{font-size:12.5px; font-weight:700; opacity:.92;}
  .kpi-trend{font-size:10.5px; font-weight:800; background:rgba(255,255,255,.2); padding:3px 8px; border-radius:99px; white-space:nowrap; position:relative; z-index:1;}
  .kpi-value{font-size:24px; font-weight:800; position:relative; z-index:1;}
  .kpi-spark{position:absolute; left:0; right:0; bottom:0; height:52px; width:100%;}
  .kpi-blue{background:linear-gradient(135deg,#2f6fed 0%,#15316b 100%); --kpi-glow:rgba(47,111,237,.45);}
  .kpi-orange{background:linear-gradient(135deg,#f9812f 0%,#7c2d12 100%); --kpi-glow:rgba(249,129,47,.45);}
  .kpi-purple{background:linear-gradient(135deg,#a855f7 0%,#581c87 100%); --kpi-glow:rgba(168,85,247,.45);}
  .kpi-green{background:linear-gradient(135deg,#13ba86 0%,#065f46 100%); --kpi-glow:rgba(19,186,134,.45);}

  /* ---------- home hero ---------- */
  .home-hero{position:relative; border-radius:18px; overflow:hidden; margin-bottom:20px; height:230px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; text-align:center; background:#0c1424; border:1px solid var(--line); box-shadow:var(--shadow);}
  .home-hero-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 40%; pointer-events:none;}
  .home-hero-overlay{position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,10,18,.25) 0%, rgba(6,10,18,.45) 45%, rgba(6,10,18,.92) 100%), linear-gradient(90deg, rgba(6,10,18,.82) 0%, rgba(6,10,18,.3) 60%, rgba(6,10,18,.12) 100%);}
  .home-hero-tag{margin-bottom:8px;}
  .home-hero-inner{position:relative; z-index:2; padding:0 32px 32px; width:100%; max-width:640px;}
  .home-hero-eyebrow{position:absolute; top:20px; left:28px; z-index:2; font-size:12px; color:var(--muted); opacity:.55; text-align:left;}
  .home-hero-eyebrow b{color:var(--ink); font-weight:700;}
  .home-counter{display:inline-flex; align-items:center; gap:14px; background:rgba(255,255,255,.05); border:1px solid rgba(6,182,212,.25); border-radius:14px; padding:13px 18px; backdrop-filter:blur(8px); box-shadow:var(--glow-cyan);}
  .home-counter-dot{width:8px; height:8px; border-radius:50%; background:#f59e0b; flex:none; box-shadow:0 0 0 4px rgba(245,158,11,.16); animation:syncPulse 1.8s ease-in-out infinite;}
  .home-counter-num{font-size:23px; font-weight:800; color:#f59e0b; letter-spacing:.2px;}
  .home-counter-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .home-counter-edit{background:none; border:none; color:var(--muted); padding:5px; border-radius:7px; display:inline-flex; margin-left:2px; transition:background-color .14s ease, color .14s ease;}
  .home-counter-edit:hover{background:var(--surface-2); color:var(--ink);}
  .home-counter-edit svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .home-counter-form{display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:14px; padding:10px 14px;}
  .home-counter-form input{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:7px 9px; font-family:inherit; font-size:13px;}
  .home-counter-form label{font-size:11.5px; color:var(--muted);}

  .tile-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:860px){ .tile-grid{grid-template-columns:1fr;} }
  .tile{position:relative; background:linear-gradient(165deg, var(--surface-2), var(--surface)); border:1px solid rgba(255,255,255,.08); border-radius:16px; box-shadow:var(--shadow); padding:22px 20px 20px; display:flex; flex-direction:column; gap:12px; text-align:left; width:100%; overflow:hidden; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;}
  .tile::before{content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--tile-c,var(--accent));}
  .tile:hover{transform:translateY(-2px); border-color:var(--muted-2); box-shadow:var(--shadow), 0 16px 36px -14px color-mix(in srgb, var(--tile-c,var(--accent)) 55%, transparent);}
  .tile-top{display:flex; align-items:center; gap:12px; justify-content:space-between;}
  .tile-num{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:800; color:var(--tile-c,var(--accent)); opacity:.95; width:30px; height:30px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--tile-c,var(--accent)) 18%, transparent);}
  .tile-icon{width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none;}
  .tile-icon svg{width:21px; height:21px; fill:none; stroke-width:1.8;}
  .tile-title{font-size:16px; font-weight:700;}
  .tile-desc{color:#b6c0d1; font-size:12.5px; line-height:1.5;}
  .tile-features{display:flex; flex-direction:column; gap:6px; margin-top:2px;}
  .tile-feature{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted);}
  .tile-feature .dot{width:5px; height:5px; border-radius:50%; background:var(--tile-c,var(--accent)); flex:none;}
  .tile-cta{margin-top:auto; padding-top:6px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px; color:var(--tile-c,var(--accent));}
  .tile-cta span{display:inline-block; transition:transform .16s ease;}
  .tile:hover .tile-cta span{transform:translateX(3px);}

  /* ---------- home cta + feature strip ---------- */
  .home-cta{display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,#f59e0b,#c2410c); border-radius:14px; padding:16px 20px; margin-top:18px; color:#fff; box-shadow:0 10px 24px -12px rgba(194,65,12,.55); transition:transform .14s ease, filter .14s ease;}
  .home-cta:hover{transform:translateY(-2px); filter:brightness(1.05);}
  .home-cta-icon{width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; flex:none;}
  .home-cta-icon svg{width:19px; height:19px; stroke:#fff; fill:none; stroke-width:1.8;}
  .home-cta-text{flex:1; font-weight:700; font-size:14px;}
  .home-cta-arrow{width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2;}

  .home-footer-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 20px;}
  @media (max-width:760px){ .home-footer-strip{grid-template-columns:repeat(2,1fr);} }
  .home-footer-item{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); font-weight:600;}
  .home-footer-item svg{width:18px; height:18px; stroke:var(--accent); fill:none; stroke-width:1.8; flex:none;}

  .site-footer{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;}
  .site-footer-top{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:28px; padding:28px 30px;}
  @media (max-width:760px){ .site-footer-top{grid-template-columns:1fr; gap:24px;} }
  .site-footer-brand{display:flex; align-items:center; gap:11px; margin-bottom:10px;}
  .site-footer-brand .brand-badge{width:36px; height:36px; border-radius:10px;}
  .site-footer-name{font-weight:800; font-size:15px; color:#fff;}
  .site-footer-desc{color:var(--muted); font-size:12.5px; line-height:1.6; max-width:320px;}
  .site-footer h4{font-size:14px; font-weight:800; letter-spacing:.3px; color:#fff; margin-bottom:14px;}
  .site-footer-list{display:flex; flex-direction:column; gap:10px;}
  .site-footer-list a, .site-footer-list span{font-size:12px; color:var(--muted); text-decoration:none; display:flex; align-items:center; gap:9px;}
  .site-footer-list a:hover{color:#fff;}
  .site-footer-list svg{width:15px; height:15px; stroke:var(--accent); fill:none; stroke-width:1.8; flex:none;}
  .site-footer-bottom{border-top:1px solid var(--line); padding:14px 30px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .site-footer-bottom span{font-size:11.5px; color:var(--muted-2);}

  .hint-box{margin-top:22px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); padding:14px 16px; font-size:12.5px; color:var(--muted);}
  .hint-box b{color:var(--ink);}
  .hint-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; margin-top:8px;}
  .hint-chip{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; transition:transform .16s ease, border-color .16s ease;}
  .hint-chip:hover{transform:translateY(-2px); border-color:var(--muted-2);}

  /* ---------- gate ---------- */
  .gate-shell{position:relative; min-height:72vh; display:flex; align-items:center; justify-content:center;}
  .gate-shell::before{content:'';position:absolute; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle, rgba(59,130,246,.28), transparent 70%); top:-100px; left:50%; transform:translateX(-88%); filter:blur(30px); pointer-events:none;}
  .gate-shell::after{content:'';position:absolute; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(168,85,247,.24), transparent 70%); bottom:-80px; left:50%; transform:translateX(30%); filter:blur(30px); pointer-events:none;}
  .gate{max-width:420px; width:100%; position:relative; z-index:1;}
  .gate-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden;}
  .gate-bar{height:5px; background:var(--gate-c,var(--accent));}
  .gate-body{padding:28px 26px 26px;}
  .gate-icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; background:var(--gate-soft,var(--surface-2));}
  .gate-icon svg{width:24px; height:24px; stroke:var(--gate-c,var(--accent)); fill:none; stroke-width:1.8;}
  .gate-body h2{font-size:18px;}
  .gate-body p{color:var(--muted); font-size:13px; margin-top:5px;}
  .error-msg{background:rgba(239,68,68,.12); color:#f87171; font-size:12.5px; padding:8px 11px; border-radius:8px; margin-top:12px;}
  .success-msg{background:rgba(34,197,94,.12); color:#4ade80; font-size:12.5px; padding:8px 11px; border-radius:8px; margin-top:12px;}

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--muted);}
  .field input,.field select,.field textarea{border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:9px 11px; border-radius:9px; font-size:13.5px; font-family:inherit;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
  .formgrid{display:flex; flex-direction:column; gap:13px; margin-top:16px;}
  .formrow2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .formrow2{grid-template-columns:1fr;} }
  .formrow3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  @media (max-width:640px){ .formrow3{grid-template-columns:1fr;} }
  .check-list{display:flex; flex-direction:column; gap:9px; margin-top:4px;}
  .check-item{display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:500; color:var(--ink); cursor:pointer;}
  .check-item input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex:none;}

  .noiquy-section{margin-bottom:16px;}
  .noiquy-head{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line);}
  .noiquy-num{font-family:'IBM Plex Mono',monospace; font-weight:800; font-size:15px; color:#f59e0b; flex:none; width:28px;}
  .noiquy-head h3{font-size:14.5px; letter-spacing:.2px;}
  .noiquy-list{list-style:none; margin:0; padding:16px 18px; display:flex; flex-direction:column; gap:14px;}
  .noiquy-item{display:flex; gap:12px; font-size:13.5px; line-height:1.65; color:#c3cbda;}
  .noiquy-item .n{flex:none; width:24px; height:24px; border-radius:7px; background:rgba(245,158,11,.15); color:#fbbf24; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center;}
  .noiquy-item b{color:var(--ink);}
  .noiquy-item.bullet .n{background:var(--surface-3); color:var(--muted);}

  .grid2{display:grid; grid-template-columns:1.35fr .85fr; gap:16px; align-items:start; margin-bottom:16px;}
  @media (max-width:920px){ .grid2{grid-template-columns:1fr;} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line);}
  .card-head h3{font-size:14.5px;}
  .card-body{padding:16px 18px;}

  .tablewrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); padding:9px 18px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody td{padding:12px 18px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num,th.num{text-align:right;}
  .empty-row td{text-align:center; color:var(--muted); padding:30px 10px;}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700;}
  .chip-thu{background:rgba(34,197,94,.15); color:#4ade80;}
  .chip-chi{background:rgba(239,68,68,.15); color:#f87171;}
  .chip-neutral{background:var(--surface-3); color:var(--muted);}
  .chip-task{background:rgba(245,158,11,.15); color:#fbbf24;}
  .chip-danger{background:rgba(239,68,68,.15); color:#f87171;}

  .progress-track{width:100%; height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden;}
  .progress-fill{height:100%; border-radius:99px;}

  .row-actions{display:flex; gap:12px; justify-content:flex-end; align-items:center;}
  .link-btn{font-size:12.5px; font-weight:700; background:none; border:none; color:var(--accent); padding:0; display:inline-block; transition:transform .14s ease;}
  .link-btn:hover{transform:translateY(-1px);}
  .link-btn.danger{color:#f87171;}
  .link-btn:hover{text-decoration:underline;}
  .confirm-wrap{display:flex; gap:8px; align-items:center; font-size:12px;}

  .chartbox{padding:16px 18px;}
  .chart-canvas-wrap{position:relative; height:230px;}

  .activity-row{display:flex; align-items:center; gap:11px; padding:9px 2px;}
  .activity-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none;}
  .activity-icon svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8;}
  .activity-mid{flex:1; min-width:0;}
  .activity-title{font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .activity-meta{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .activity-right{font-size:12.5px; font-weight:700; white-space:nowrap;}

  .admin-list{display:flex; flex-direction:column; gap:10px;}
  .admin-row{display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--line); border-radius:11px; padding:11px 14px; background:var(--surface-2);}
  .admin-row .name{font-weight:700; font-size:13.5px;}
  .admin-row .meta{font-size:12px; color:var(--muted); margin-top:2px;}

  .filter-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 18px; border-bottom:1px solid var(--line);}
  .filter-bar select, .filter-bar input{border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:7px 10px; border-radius:8px; font-size:12.5px; font-family:inherit;}
  .filter-bar select:focus, .filter-bar input:focus{border-color:var(--accent);}

  .photo-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .photo-thumb{position:relative; width:64px; height:64px; border-radius:9px; overflow:hidden; border:1px solid var(--line); flex:none;}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb button{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.65); color:#fff; border:none; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .photo-hint{font-size:11.5px; color:var(--muted-2); margin-top:6px;}

  .photo-strip{display:flex; align-items:center; gap:5px; margin-top:6px;}
  .photo-chip{width:26px; height:26px; border-radius:7px; object-fit:cover; border:1px solid var(--line); cursor:pointer; flex:none; transition:transform .14s ease, border-color .14s ease;}
  .photo-chip:hover{border-color:var(--accent); transform:scale(1.15);}
  .photo-more{font-size:11px; color:var(--muted); font-weight:700;}

  .total-row td{border-top:2px solid var(--line); background:var(--surface-2);}

  .lightbox-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:100; display:flex; align-items:center; justify-content:center; padding:30px;}
  .lightbox-backdrop img{max-width:90vw; max-height:88vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5); display:block;}
  .lightbox-close{position:fixed; top:20px; right:24px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.14); color:#fff; border:none; font-size:20px;}
  .lightbox-close:hover{background:rgba(255,255,255,.24);}

  @media (max-width:900px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:sticky; flex-direction:row; align-items:center; padding:10px 14px; gap:14px; overflow-x:auto;}
    .brand{padding:0; flex:none;}
    .brand-sub{display:none;}
    .sidebar-nav{flex-direction:row; flex:1;}
    .navitem span{display:none;}
    .navitem{padding:10px;}
    .sidebar-spacer{display:none;}
    .sidebar-user{border-top:none; margin-top:0; padding:0;}
    .sidebar-user .info{display:none;}
    .topbar{padding:12px 16px;}
    .search-box{max-width:170px;}
    .page{padding:22px 16px 56px;}
  }

  @media (max-width:640px){
    .topbar, .home-counter, .sync-status{backdrop-filter:none;}
    .topbar{background:#0e1424;}
  }
</style>

const API_URL = 'https://script.google.com/macros/s/AKfycbwMy7whc6j2ZpP_bmbqWO1e7VL0p_TFYy1ecZkBRUhAfSQfQ-oV-AwiOy2wCksxnMe-/exec';
/* khoá bí mật dùng chung với Code.gs (biến API_SECRET bên đó) — mọi request phải kèm đúng khoá này */
const API_SECRET = 'adgzqusrypkn5mijxfbh6v749o8tl0c3w12e';

let jsonpCounter = 0;
function apiGet(action){
  return new Promise((resolve, reject) => {
    if(!API_URL){ reject(new Error('no API_URL')); return; }
    const cbName = 'sctCb' + (++jsonpCounter);
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 25000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timeout); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error('network error')); };
    script.src = API_URL + '?action=' + encodeURIComponent(action) + '&secret=' + encodeURIComponent(API_SECRET) + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}
/* ghi qua GET+JSONP — đọc được kết quả thật (khác apiPost no-cors ở dưới),
   nên biết chắc thành công hay lỗi, phục vụ tự động thử lại khi bận khoá. */
function apiGetWrite(action, req){
  return new Promise((resolve, reject) => {
    if(!API_URL){ reject(new Error('no API_URL')); return; }
    const cbName = 'sctCb' + (++jsonpCounter);
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timeout); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error('network error')); };
    script.src = API_URL + '?action=' + encodeURIComponent(action) + '&secret=' + encodeURIComponent(API_SECRET) + '&req=' + encodeURIComponent(JSON.stringify(req)) + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}
async function apiPost(action, data){
  /* Chỉ dùng khi payload có ảnh mới (base64) — quá dài để gửi qua GET.
     Apps Script Web App không trả header CORS ổn định nên fetch() thường
     không đọc lại được response — dùng no-cors để request vẫn gửi đi và
     Apps Script vẫn ghi được, chấp nhận không đọc được kết quả trả về
     (không biết chắc thành công hay lỗi, không thử lại được). */
  await fetch(API_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, secret:API_SECRET}, data))
  });
  return { status:'success' };
}
/* gọi lại fn() tối đa (1+extraAttempts) lần nếu lỗi hoặc server báo status:'error',
   có chờ giãn cách giữa các lần — dùng cho các thao tác ghi quan trọng khi nhiều
   người cùng dùng app một lúc dễ gặp tình trạng bận khoá ghi tạm thời. */
function withRetry(fn, delaysMs){
  return new Promise((resolve)=>{
    let attempt = 0;
    function tryOnce(){
      fn().then(res=>{
        if(res && res.status==='error'){ throw new Error(res.message||'server error'); }
        resolve({ok:true, res});
      }).catch(err=>{
        if(attempt >= delaysMs.length){ resolve({ok:false, err}); return; }
        const delay = delaysMs[attempt];
        attempt++;
        setTimeout(tryOnce, delay);
      });
    }
    tryOnce();
  });
}
async function syncWrite(action, payload){
  if(!API_URL) return;
  setSyncStatus('syncing');
  const req = Object.assign({}, payload);
  const encodedLen = encodeURIComponent(JSON.stringify(req)).length;
  const attempt = encodedLen < 6000
    ? ()=>apiGetWrite(action, req)
    : ()=>apiPost(action, payload); // payload quá dài (VD nhiều ảnh cũ) — gửi 1 lần, không thử lại được
  const result = await withRetry(attempt, encodedLen < 6000 ? [1500, 4000] : []);
  setSyncStatus(result.ok ? 'online' : 'offline');
}
function setSyncStatus(status){
  state.syncStatus = status;
  renderSyncStatus();
}
function normalizeDate(v){
  if(v===''||v==null) return '';
  const s = String(v);
  const isoDt = s.match(/^(\d{4}-\d{2}-\d{2})T/);
  if(isoDt) return isoDt[1];
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const dmy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(dmy) return dmy[3]+'-'+dmy[2].padStart(2,'0')+'-'+dmy[1].padStart(2,'0');
  return s;
}
/* đọc trường không phân biệt hoa/thường của tiêu đề cột trong Sheets
   (VD: cột ghi "fullname" hay "FullName" đều nhận được đúng như "fullName") */
function pick(row, key){
  if(row[key] !== undefined) return row[key];
  const found = Object.keys(row).find(k => k.toLowerCase() === key.toLowerCase());
  return found !== undefined ? row[found] : undefined;
}

async function syncAllFromServer(){
  if(!API_URL) return;
  setSyncStatus('syncing');
  try{
    const data = await apiGet('all');
    if(data.users) save(LS.users, normalizeUsers(data.users));
    if(data.finance) save(LS.finance, normalizeFinance(data.finance));
    if(data.materials) save(LS.materials, normalizeMaterials(data.materials));
    if(data.construction) save(LS.construction, normalizeConstruction(data.construction));
    if(data.staffCt) save(LS.staffCt, normalizeStaffCt(data.staffCt));
    if(data.staffTd) save(LS.staffTd, normalizeStaffTd(data.staffTd));
    if(data.vatTuChinh) save(LS.vatTuChinh, normalizeVatTuChinh(data.vatTuChinh));
    if(data.vatTuPhu) save(LS.vatTuPhu, normalizeVatTuPhu(data.vatTuPhu));
    setSyncStatus('online');
    render();
  }catch(err){
    setSyncStatus('offline');
  }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : '';
  const last = parts.length>1 ? parts[parts.length-1][0] : '';
  return (first+last).toUpperCase();
}

function resizeImageFile(file, maxDim){
  maxDim = maxDim || 900;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function fmtISO(d){ return d.toISOString().slice(0,10); }
function computePeriodRange(period){
  const today = new Date();
  let from, to;
  if(period==='ngay'){ from=today; to=today; }
  else if(period==='tuan'){
    const dow = (today.getDay()+6)%7;
    from = new Date(today); from.setDate(today.getDate()-dow);
    to = new Date(from); to.setDate(from.getDate()+6);
  } else {
    from = new Date(today.getFullYear(), today.getMonth(), 1);
    to = new Date(today.getFullYear(), today.getMonth()+1, 0);
  }
  return { from: fmtISO(from), to: fmtISO(to) };
}
function conPeriodPreset(period){
  const r = computePeriodRange(period);
  state.tqPeriod = period;
  state.tqFrom = r.from;
  state.tqTo = r.to;
}

/* tính tồn kho (nhập-xuất) theo từng loại vật tư từ danh sách giao dịch —
   dùng chung cho cả 2 tab Vật tư chính/phụ và cảnh báo sắp hết hàng */
function khoStockSummary(rows, nameKey){
  const map = {};
  rows.forEach(r=>{
    const name = r[nameKey];
    if(!name) return;
    if(!map[name]) map[name] = { name, unit:r.unit, nhap:0, xuat:0 };
    if(r.direction==='xuat') map[name].xuat += (r.quantity||0);
    else map[name].nhap += (r.quantity||0);
  });
  return Object.values(map).map(m=>({...m, ton: m.nhap - m.xuat}));
}
function renderNotif(){
  const wrap = document.getElementById('notifWrap');
  const lowStock = khoStockSummary(load(LS.vatTuChinh, []), 'material').filter(m=>m.ton<10);
  wrap.innerHTML = `
    <button class="bell" onclick="toggleNotif(event)">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;">${BELL_ICON}</svg>
      ${lowStock.length?`<span class="badge">${lowStock.length}</span>`:''}
    </button>
    ${state.notifOpen?`
    <div class="notif-panel">
      <div class="notif-head">Cảnh báo tồn kho (vật tư chính)</div>
      ${lowStock.length===0?`<div class="notif-empty">Không có cảnh báo nào.</div>`:
        lowStock.map(m=>`<div class="notif-row"><span>${esc(m.name)}</span><b class="num">${m.ton} ${esc(m.unit)}</b></div>`).join('')}
    </div>`:''}
  `;
}

}

/* mật khẩu lưu dạng SHA-256 hash (không lưu chữ thường) — hash ngay trên trình duyệt
   trước khi lưu localStorage/gửi lên Sheets. Tài khoản cũ còn mật khẩu dạng thường
   (từ trước khi có tính năng này) sẽ được tự nâng cấp lên hash ngay lần đăng nhập
   thành công tiếp theo, không cần người dùng làm gì. */
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function looksHashed(pw){ return /^[a-f0-9]{64}$/.test(String(pw||'')); }

async function doLogin(e, wantModule){
  e.preventDefault();
  const f = e.target;
  const username = f.username.value.trim();
  const password = f.password.value;
  const users = load(LS.users, []);
  const idx = users.findIndex(x=>x.username===username);
  let u = idx!==-1 ? users[idx] : null;
  if(u){
    if(looksHashed(u.password)){
      if((await sha256Hex(password)) !== u.password) u = null;
    } else if(u.password === password){
      const hash = await sha256Hex(password);
      users[idx] = {...u, password:hash};
      save(LS.users, users);
      syncWrite('saveUser', {data: users[idx]});
      u = users[idx];
    } else {
      u = null;
    }
  }
  if(!u){ state.err.denied='Sai tên đăng nhập hoặc mật khẩu.'; render(); return false; }
  setSession({username:u.username, role:u.role, modules:parseModules(u.module), fullName:u.fullName});
  if(wantModule && !canAccess(wantModule)){
    state.err.denied = `Tài khoản "${u.fullName}" không có quyền truy cập mục "${MODULES[wantModule].label}".`;
  } else {
    state.err.denied = null;
  }
  render();
  playPageAnim();
  return false;
}

/* ---- tab: Vật tư phụ (hàng phát sinh, có đơn giá) ---- */
function kvtPhuCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.vatTuPhu, []);
  const direction = f.direction.value;
  const payload = {
    date:f.date.value, direction,
    itemName: f.itemName.value.trim(),
    unit: f.unit.value.trim(),
    quantity: Math.max(0, Number(f.quantity.value)||0),
    price: direction==='nhap' ? Math.max(0, Number(f.price.value)||0) : 0,
    team: direction==='xuat' ? f.team.value.trim() : '',
    note: f.note.value.trim(),
    photos: state.khoPhotoDraft.slice()
  };
  if(state.edit.kho){
    payload.id = state.edit.kho;
    const idx = rows.findIndex(r=>r.id===state.edit.kho);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows);
    rows.push(payload);
  }
  const ok = save(LS.vatTuPhu, rows);
  if(!ok){
    state.err.kho = 'Không thể lưu — bộ nhớ trình duyệt đã đầy. Hãy xoá bớt ảnh hoặc bản ghi cũ rồi thử lại.';
    render();
    return;
  }
  state.err.kho = null;
  syncWithPhotos('saveVatTuPhu', 'vattu_phu', payload);
  state.edit.kho=null; state.formOpen.kho=false; render();
}
function kvtPhuEdit(id){
  state.edit.kho=id; state.formOpen.kho=true;
  const row = load(LS.vatTuPhu, []).find(r=>r.id===id);
  state.khoPhotoDraft = row && row.photos ? row.photos.slice() : [];
  render();
}
function kvtPhuDelete(id){
  save(LS.vatTuPhu, load(LS.vatTuPhu,[]).filter(r=>r.id!==id));
  syncWrite('deleteVatTuPhu', {id});
  state.confirmId=null; render();
}

function khoDashLineChart(rows, materialLabel){
  const el = document.getElementById('khoDashLineChart');
  if(!el) return;
  if(state.charts.khoDashLine) state.charts.khoDashLine.destroy();
  const ink = getComputedStyle(document.body).getPropertyValue('--muted').trim();
  const nhapByDate = {};
  rows.filter(r=>r.direction==='nhap').forEach(r=>{ nhapByDate[r.date] = (nhapByDate[r.date]||0) + (r.quantity||0); });
  const dates = Object.keys(nhapByDate).sort();
  state.charts.khoDashLine = new Chart(el, {
    type:'line',
    data:{
      labels: dates.map(d=>vdate(d)),
      datasets:[{
        label: materialLabel||'Nhập', data: dates.map(d=>nhapByDate[d]),
        borderColor:'#f59e0b', backgroundColor:'rgba(245,158,11,.18)', fill:true, tension:.35, pointRadius:3, borderWidth:2

    options:{
      plugins:{legend:{display:false}},
      scales:{ x:{ticks:{color:ink}, grid:{color:'rgba(255,255,255,.06)'}}, y:{beginAtZero:true, ticks:{color:ink, precision:0}, grid:{color:'rgba(255,255,255,.08)'}} }
    }
  });
}
function khoDashDonutChart(rows){

function parseWeather(str){
  const m = String(str||'').match(/Sáng:\s*(.*?)\s*\/\s*Chiều:\s*(.*)$/);
  return m ? {am:m[1], pm:m[2]} : {am:WEATHER_OPTIONS[0], pm:WEATHER_OPTIONS[0]};
}
function conCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.construction, []);
  const workersAm = Math.max(0, Number(f.workersAm.value)||0);
  const workersPm = Math.max(0, Number(f.workersPm.value)||0);
  const payload = {
    team:f.team.value.trim(), task:f.task.value, date:f.date.value, floor:f.floor.value.trim(),
    workersAm, workersPm, workers: (workersAm+workersPm)/2,
    progress: Math.max(0,Math.min(100, Number(f.progress.value)||0)), note:f.note.value.trim(),
    weather: 'Sáng: '+f.weatherAm.value+' / Chiều: '+f.weatherPm.value,
    reportedBy: f.reportedBy.value.trim(),
    photos: state.conPhotoDraft.slice()
  };
  let newRows;
  if(state.edit.thi_cong){
    payload.id = state.edit.thi_cong;
    const idx = rows.findIndex(r=>r.id===state.edit.thi_cong);
    newRows = rows.slice();
    newRows[idx] = {...newRows[idx], ...payload};
  } else {
    payload.id = uid(rows);
    newRows = [...rows, payload];
  }
  const ok = save(LS.construction, newRows);
  if(!ok){
    state.err.thiCong = 'Không thể lưu — bộ nhớ trình duyệt đã đầy. Hãy xoá bớt ảnh hoặc bản ghi cũ rồi thử lại.';
    render();
    return;
  }
  state.err.thiCong = null;
  syncConstruction(payload);
  state.edit.thi_cong=null; state.formOpen.thi_cong=false; render();
}
function conEdit(id){
  state.edit.thi_cong=id; state.formOpen.thi_cong=true;
  const row = load(LS.construction, []).find(r=>r.id===id);
  state.conPhotoDraft = row && row.photos ? row.photos.slice() : [];

}
function conDelete(id){
  save(LS.construction, load(LS.construction,[]).filter(r=>r.id!==id));

}

/* gửi 1 bản ghi có kèm ảnh lên Apps Script — ảnh mới (data:) upload lên Drive, ảnh cũ (http) giữ nguyên link.
   Dùng chung cho Thi công, Vật tư chính, Vật tư phụ. */
async function syncWithPhotos(action, filePrefix, payload){
  if(!API_URL) return;
  const photos = payload.photos||[];
  const existing = photos.filter(p=>!p.startsWith('data:'));
  const fresh = photos.filter(p=>p.startsWith('data:'));
  const newPhotos = fresh.map(dataUrl=>{
    const [meta, b64] = dataUrl.split(',');
    const mimeType = (meta.match(/data:(.*?);base64/)||[])[1] || 'image/jpeg';
    return { base64:b64, mimeType, fileName:filePrefix+'_'+payload.id+'_'+Date.now()+'.jpg' };
  });
  const dataOut = {...payload, photos: existing.join(',')};
  setSyncStatus('syncing');
  if(newPhotos.length){
    // có ảnh mới (base64) — payload quá dài để đi qua GET, gửi 1 lần qua POST, không thử lại được
    apiPost(action, { data: dataOut, newPhotos })
      .then(res=>setSyncStatus(res && res.status==='success' ? 'online' : 'offline'))
      .catch(()=> setSyncStatus('offline'));
  } else {
    const result = await withRetry(()=>apiGetWrite(action, { data: dataOut, newPhotos:[] }), [1500, 4000]);
    setSyncStatus(result.ok ? 'online' : 'offline');
  }
}
function syncConstruction(payload){ return syncWithPhotos('saveConstruction', 'thi_cong', payload); }

/* tổng hợp tổng công và số ngày thi công theo từng tầng, dùng cho bảng "Tiến độ theo tầng" */
function floorProgressSummary(rows){
  const byFloor = {};
  rows.forEach(r=>{
    const key = r.floor || '(Chưa gán tầng)';
    if(!byFloor[key]) byFloor[key] = { floor:key, workers:0, dates:new Set() };
    byFloor[key].workers += (r.workers||0);
    if(r.date) byFloor[key].dates.add(r.date);
  });
  return Object.values(byFloor)
    .map(f=>({ floor:f.floor, workers:f.workers, days:f.dates.size }))
    .sort((a,b)=>b.workers-a.workers);
}

function renderThiCongQuanSo(allRows){
  const sub = document.getElementById('thiCongSub');
  const teams = [...new Set(allRows.map(r=>r.team))];
  const perTeam = teams.map(t=>{
    const ws = allRows.filter(r=>r.team===t).map(r=>r.workers||0);
    return {
      team:t,
      count: ws.length,
      avg: ws.length ? ws.reduce((a,b)=>a+b,0)/ws.length : 0,
      max: ws.length ? Math.max(...ws) : 0,
      min: ws.length ? Math.min(...ws) : 0
    };
  });
  const allWorkers = allRows.map(r=>r.workers||0);
  const avgAll = allWorkers.length ? allWorkers.reduce((a,b)=>a+b,0)/allWorkers.length : 0;
  const maxAll = allWorkers.length ? Math.max(...allWorkers) : 0;
  const minAll = allWorkers.length ? Math.min(...allWorkers) : 0;
  const totalCong = allWorkers.reduce((a,b)=>a+b,0);

  sub.innerHTML = `
    <div class="kpi-grid cols-3">
      ${kpiCard('spark-q0','kpi-blue','Công trung bình / ngày', formatCong(avgAll), teams.length+' tổ đội')}
      ${kpiCard('spark-q1','kpi-green','Công cao nhất / ngày', formatCong(maxAll))}
      ${kpiCard('spark-q2','kpi-purple','Tổng công', formatCong(totalCong))}
    </div>
    <div class="card chartbox" style="margin-bottom:16px;">
      <h3 style="margin-bottom:12px;">Quân số theo tổ đội</h3>
      <div class="chart-canvas-wrap"><canvas id="conQuanSoChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Công trung bình mỗi ngày theo tổ đội</h3></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Tổ đội</th><th class="num">Số báo cáo</th><th class="num">Công TB/ngày</th><th class="num">Cao nhất</th><th class="num">Thấp nhất</th></tr></thead>
        <tbody>
          ${perTeam.length===0?`<tr class="empty-row"><td colspan="5">Chưa có dữ liệu.</td></tr>`:
          perTeam.map(t=>`
            <tr>
              <td><b>${esc(t.team)}</b></td>
              <td class="num">${t.count}</td>
              <td class="num">${formatCong(t.avg)} công</td>
              <td class="num">${formatCong(t.max)} công</td>
              <td class="num">${formatCong(t.min)} công</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
  `;
  conQuanSoChart(allRows);
  mountSparklines([
    {id:'spark-q0', data:allRows.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>r.workers||0)},
    {id:'spark-q1', data:allRows.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>r.workers||0)},
    {id:'spark-q2', data:allRows.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(r=>r.workers||0)}
  ]);
}

function renderThiCongDoiNhom(allRows){
  const sub = document.getElementById('thiCongSub');
  const teams = [...new Set(allRows.map(r=>r.team))];
  const cards = teams.map((t,i)=>{
    const rows = allRows.filter(r=>r.team===t);
    const totalWorkers = rows.reduce((a,r)=>a+(r.workers||0),0);
    const lastDate = rows.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
    const avgProgress = rows.length ? Math.round(rows.reduce((a,r)=>a+r.progress,0)/rows.length) : 0;

    return `

      </div>
      <div class="tile-title">${esc(t)}</div>

    </div>
  `;

function staffCtCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.staffCt, []);
  const payload = {
    name:f.name.value.trim(), position:f.position.value.trim(), phone:f.phone.value.trim(),
    startDate:f.startDate.value, salary:Number(f.salary.value)||0, status:f.status.value, note:f.note.value.trim()
  };
  if(state.edit.nhansu_ct){
    payload.id = state.edit.nhansu_ct;
    const idx = rows.findIndex(r=>r.id===state.edit.nhansu_ct);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows);
    rows.push(payload);
  }
  save(LS.staffCt, rows);
  syncWrite('saveStaffCt', {data: payload});
  state.edit.nhansu_ct=null; state.formOpen.nhansu_ct=false; render();
}
function staffCtEdit(id){ state.edit.nhansu_ct=id; state.formOpen.nhansu_ct=true; render(); }
function staffCtDelete(id){

  state.confirmId=null; render();
}

/* ---------- ĐỔI MẬT KHẨU (mọi tài khoản đã đăng nhập) ---------- */
async function changePasswordSubmit(e){
  e.preventDefault();
  const f = e.target;
  const s = getSession();
  const users = load(LS.users, []);
  const idx = users.findIndex(u=>u.username===s.username);
  if(idx===-1){ state.err.pwd='Không tìm thấy tài khoản.'; state.pwdOk=false; render(); return false; }
  const current = f.currentPassword.value;
  const next = f.newPassword.value;
  const confirm = f.confirmPassword.value;
  const stored = users[idx].password;
  const currentOk = looksHashed(stored) ? (await sha256Hex(current))===stored : stored===current;
  if(!currentOk){ state.err.pwd='Mật khẩu hiện tại không đúng.'; state.pwdOk=false; render(); return false; }
  if(next.length < 4){ state.err.pwd='Mật khẩu mới cần ít nhất 4 ký tự.'; state.pwdOk=false; render(); return false; }
  if(next !== confirm){ state.err.pwd='Xác nhận mật khẩu mới không khớp.'; state.pwdOk=false; render(); return false; }
  users[idx] = {...users[idx], password: await sha256Hex(next)};
  save(LS.users, users);
  syncWrite('saveUser', {data: users[idx]});
  state.err.pwd = null;
  state.pwdOk = true;
  render();
  return false;
}
function renderChangePassword(){
  const s = getSession();
  document.getElementById('page').innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">Tài khoản</span>
        <h1>Đổi mật khẩu</h1>
        <p>Áp dụng cho tài khoản đang đăng nhập: <b style="color:var(--ink);">${esc(s.fullName)} (${esc(s.username)})</b></p>
      </div>

            <div class="field"><label>Mật khẩu mới</label><input type="password" name="newPassword" autocomplete="new-password" required></div>

}

/* ---------- ADMIN: quản trị tài khoản ----------
   Cột "module" trong Sheets lưu danh sách module được phép, cách nhau bởi
   dấu phẩy (VD: "tai_chinh,kho") — parseModules() ở trên tách ra thành mảng. */
function moduleChecklist(name, selected){
  return `
  <div class="check-list">
    ${Object.entries(MODULES).map(([k,m])=>`
      <label class="check-item">
        <input type="checkbox" name="${name}" value="${k}" ${selected.includes(k)?'checked':''}>
        ${esc(m.label)}
      </label>`).join('')}
  </div>`;
}
async function adminCreateUser(e){
  e.preventDefault();
  const f = e.target;
  const users = load(LS.users, []);
  const username = f.username.value.trim();
  if(users.some(u=>u.username===username)){ state.err.admin='Tên đăng nhập đã tồn tại.'; render(); return false; }
  const modules = Array.from(f.querySelectorAll('input[name="modules"]:checked')).map(el=>el.value);
  if(modules.length===0){ state.err.admin='Chọn ít nhất 1 module được phép truy cập.'; render(); return false; }
  const newUser = { username, password: await sha256Hex(f.password.value), role:'editor', module:modules.join(','), fullName:f.fullName.value.trim() };
  users.push(newUser);
  save(LS.users, users);
  syncWrite('saveUser', {data: newUser});
  state.err.admin=null;
  render();
  return false;
}
function adminDeleteUser(username){
  save(LS.users, load(LS.users,[]).filter(u=>u.username!==username));
  syncWrite('deleteUser', {username});
  state.confirmId=null; render();
}
function adminToggleEditModules(username){
  state.editingUserModules = state.editingUserModules===username ? null : username;
  render();
}
function adminSaveUserModules(e, username){
  e.preventDefault();
  const f = e.target;
  const modules = Array.from(f.querySelectorAll('input[name="modules"]:checked')).map(el=>el.value);
  const users = load(LS.users, []);
  const idx = users.findIndex(u=>u.username===username);
  if(idx===-1) return false;
  users[idx] = {...users[idx], module: modules.join(',')};
  save(LS.users, users);
  syncWrite('saveUser', {data: users[idx]});
  state.editingUserModules = null;
  render();
  return false;
}

                <form onsubmit="return adminSaveUserModules(event,'${u.username}')">
                  ${moduleChecklist('modules', mods)}
                  <div style="display:flex; gap:10px; margin-top:12px;">

                    <button class="btn" type="button" onclick="adminToggleEditModules('${u.username}')" style="padding:7px 13px; font-size:12.5px;">Huỷ</button>

                </span>` : `<div class="row-actions">
                  <button class="link-btn" onclick="adminToggleEditModules('${u.username}')">Sửa quyền</button>

                </div>`))}
            </div>
          `;}).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Thêm tài khoản Editor</h3></div>
        <div class="card-body">
          <form onsubmit="return adminCreateUser(event)">

              <div class="field"><label>Mật khẩu</label><input name="password" type="text" required></div>
              <div class="field"><label>Các module được phép truy cập</label>
                ${moduleChecklist('modules', [])}

              <button class="btn btn-accent" type="submit">Tạo tài khoản</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;
}

/* ---------- router / render ---------- */
function render(){
  renderChrome();
  if(state.view==='home') return renderHome();
  if(state.view==='noi_quy') return renderNoiQuy();
  if(state.view==='admin'){
    const s=getSession();
    if(!s || s.role!=='admin'){ state.view='home'; return renderHome(); }
    return renderAdmin();
  }
  if(state.view==='doi_mat_khau'){
    const s=getSession();
    if(!s){ state.view='home'; return renderHome(); }
    return renderChangePassword();
  }
  if(['tai_chinh','kho','thi_cong','nhansu_ct','nhansu_td'].includes(state.view)){
    if(!canAccess(state.view)) return renderGate(state.view);
    if(state.view==='tai_chinh') return renderFinance();
    if(state.view==='kho') return renderKho();
    if(state.view==='thi_cong') return renderThiCong();
    if(state.view==='nhansu_ct') return renderNhanSuCT();
    if(state.view==='nhansu_td') return renderNhanSuTD();
  }
}
render();
syncAllFromServer();
