<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIK Cổ Loa">
<title>Tuấn Tú Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0e16;
    --sidebar-bg:#0c1019;
    --surface:#121722;
    --surface-2:#171e2b;
    --surface-3:#1d2536;
    --ink:#eef2f7;
    --muted:#8792a3;
    --muted-2:#5b6577;
    --line:rgba(255,255,255,.08);
    --accent:#3b82f6;
    --accent-ink:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.6);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  h1,h2,h3{text-wrap:balance; margin:0; font-weight:700;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- shell ---------- */
  .app-shell{display:flex; min-height:100vh;}
  .sidebar{
    width:258px; flex:none; background:var(--sidebar-bg); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}

  .brand{display:flex; align-items:center; gap:11px; padding:6px 8px 22px;}
  .brand-badge{width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#3b82f6,#8b5cf6); display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 4px 14px -4px rgba(59,130,246,.55);}
  .brand-badge svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.9;}
  .brand-name{font-weight:800; font-size:15.5px; color:#fff; letter-spacing:.2px;}
  .brand-sub{font-size:11px; color:var(--muted); margin-top:-1px;}

  .sidebar-nav{display:flex; flex-direction:column; gap:2px;}
  .navitem{display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:10px; color:var(--muted); font-size:13.5px; font-weight:600; width:100%; text-align:left; background:transparent; border:none; transition:background-color .16s ease, color .16s ease, transform .16s ease;}
  .navitem:active{transform:scale(.97);}
  .navitem svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none;}
  .navitem span{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .navitem:hover{background:var(--surface-2); color:var(--ink); transform:translateX(3px);}
  .navitem.active{background:var(--surface-3); color:#fff;}
  .navitem .lock{width:12px; height:12px; opacity:.55; flex:none;}
  .sidebar-spacer{flex:1;}

  .sync-status{display:flex; align-items:center; gap:7px; padding:8px 7px 8px 11px; margin-top:6px; font-size:11.5px; color:var(--muted);}
  .sync-label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sync-dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--muted-2);}
  .sync-refresh{background:none; border:none; color:var(--muted); padding:5px; border-radius:7px; display:flex; flex:none; transition:transform .5s ease, background-color .16s ease, color .16s ease;}
  .sync-refresh svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2;}
  .sync-refresh:hover{background:var(--surface-2); color:var(--ink);}
  .sync-refresh:active svg{transform:rotate(180deg);}
  .sync-refresh[disabled]{opacity:.5; cursor:default;}
  .sync-refresh[disabled] svg{animation:syncSpin .8s linear infinite;}
  @keyframes syncSpin{ to{ transform:rotate(360deg); } }
  .sync-dot.syncing{background:#f59e0b; animation:syncPulse 1s ease-in-out infinite;}
  .sync-dot.online{background:#22c55e;}
  .sync-dot.offline{background:#ef4444;}
  @keyframes syncPulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .sidebar-user{display:flex; align-items:center; gap:10px; padding:12px 9px 4px; border-top:1px solid var(--line); margin-top:10px;}
  .avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#8b5cf6); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; color:#fff; flex:none;}
  .sidebar-user .info{flex:1; min-width:0;}
  .sidebar-user .info b{display:block; font-size:13px; color:var(--ink); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar-user .info span{font-size:11.5px; color:var(--muted);}
  .sidebar-user button{background:none; border:none; color:var(--muted); padding:7px; border-radius:8px; flex:none; display:flex; transition:transform .14s ease, background-color .14s ease, color .14s ease;}
  .sidebar-user button:hover{background:var(--surface-2); color:var(--ink); transform:scale(1.1);}

  /* ---------- topbar ---------- */
  .topbar{position:sticky; top:0; z-index:15; background:rgba(10,14,22,.82); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:16px;}
  .search-box{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 13px; width:100%; max-width:320px; color:var(--muted);}
  .search-box:has(input:disabled){opacity:.5;}
  .search-box svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none;}
  .search-box input{background:none; border:none; outline:none; color:var(--ink); font-size:13.5px; width:100%; font-family:inherit;}
  .search-box input::placeholder{color:var(--muted-2);}
  .topbar-right{margin-left:auto; display:flex; align-items:center; gap:12px;}
  #notifWrap{position:relative;}
  .bell{position:relative; width:38px; height:38px; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); transition:transform .16s ease, color .16s ease, border-color .16s ease;}
  .bell:hover{color:var(--ink); border-color:var(--muted-2); transform:translateY(-2px);}
  .bell .badge{position:absolute; top:-5px; right:-5px; background:#ef4444; color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 4px; border:2px solid var(--bg);}
  .notif-panel{position:absolute; top:48px; right:0; width:270px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:8px; z-index:30;}
  .notif-head{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; padding:6px 8px;}
  .notif-row{display:flex; justify-content:space-between; gap:10px; padding:7px 8px; border-radius:8px; font-size:12.5px;}
  .notif-row:hover{background:var(--surface-2);}
  .notif-row b{color:#f87171;}
  .notif-empty{padding:10px 8px; font-size:12.5px; color:var(--muted);}

  .btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:9px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:transform .14s ease, border-color .14s ease, filter .14s ease;}
  .btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-accent{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 6px 16px -6px rgba(59,130,246,.6);}
  .btn-accent:hover{filter:brightness(1.08);}

  .page{max-width:1280px; padding:26px 26px 64px;}
  @keyframes pageEnter{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .page.anim{ animation:pageEnter .32s cubic-bezier(.22,.61,.36,1); }
  @media (prefers-reduced-motion: reduce){ .page.anim{ animation:none; } }
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
  .section-head h1{font-size:23px;}
  .section-head p{color:var(--muted); font-size:13.5px; margin-top:4px;}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block;}

  /* ---------- kpi gradient cards ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
  .kpi-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:1080px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .kpi-grid{grid-template-columns:1fr;} }
  .kpi-card{position:relative; overflow:hidden; border-radius:16px; padding:18px 20px 56px; min-height:120px; color:#fff; display:flex; flex-direction:column; gap:8px; transition:transform .16s ease, box-shadow .16s ease;}
  .kpi-card:hover{transform:translateY(-3px); box-shadow:0 14px 30px -14px rgba(0,0,0,.55);}
  .kpi-card::before{content:'';position:absolute; inset:0; background:radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,.18), transparent 60%); pointer-events:none;}
  .kpi-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:relative; z-index:1;}
  .kpi-label{font-size:12.5px; font-weight:700; opacity:.92;}
  .kpi-trend{font-size:10.5px; font-weight:800; background:rgba(255,255,255,.2); padding:3px 8px; border-radius:99px; white-space:nowrap; position:relative; z-index:1;}
  .kpi-value{font-size:24px; font-weight:800; position:relative; z-index:1;}
  .kpi-spark{position:absolute; left:0; right:0; bottom:0; height:52px; width:100%;}
  .kpi-blue{background:linear-gradient(135deg,#2f6fed 0%,#15316b 100%);}
  .kpi-orange{background:linear-gradient(135deg,#f9812f 0%,#7c2d12 100%);}
  .kpi-purple{background:linear-gradient(135deg,#a855f7 0%,#581c87 100%);}
  .kpi-green{background:linear-gradient(135deg,#13ba86 0%,#065f46 100%);}

  .tile-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media (max-width:860px){ .tile-grid{grid-template-columns:1fr;} }
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; display:flex; flex-direction:column; gap:12px; text-align:left; width:100%; transition:transform .12s ease;}
  .tile:hover{transform:translateY(-2px); border-color:var(--muted-2);}
  .tile-top{display:flex; align-items:center; gap:12px;}
  .tile-icon{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none;}
  .tile-icon svg{width:22px; height:22px; fill:none; stroke-width:1.8;}
  .tile-title{font-size:16.5px; font-weight:700;}
  .tile-desc{color:#b6c0d1; font-size:13px; line-height:1.5;}
  .tile-cta{margin-top:auto; padding-top:6px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:5px;}
  .tile-cta span{display:inline-block; transition:transform .16s ease;}
  .tile:hover .tile-cta span{transform:translateX(3px);}

  .hint-box{margin-top:22px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius); padding:14px 16px; font-size:12.5px; color:var(--muted);}
  .hint-box b{color:var(--ink);}
  .hint-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; margin-top:8px;}
  .hint-chip{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; transition:transform .16s ease, border-color .16s ease;}
  .hint-chip:hover{transform:translateY(-2px); border-color:var(--muted-2);}

  /* ---------- gate ---------- */
  .gate-shell{position:relative; min-height:72vh; display:flex; align-items:center; justify-content:center;}
  .gate-shell::before{content:'';position:absolute; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle, rgba(59,130,246,.28), transparent 70%); top:-100px; left:50%; transform:translateX(-88%); filter:blur(30px); pointer-events:none;}
  .gate-shell::after{content:'';position:absolute; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(168,85,247,.24), transparent 70%); bottom:-80px; left:50%; transform:translateX(30%); filter:blur(30px); pointer-events:none;}
  .gate{max-width:420px; width:100%; position:relative; z-index:1;}
  .gate-card{background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden;}
  .gate-bar{height:5px; background:var(--gate-c,var(--accent));}
  .gate-body{padding:28px 26px 26px;}
  .gate-icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; background:var(--gate-soft,var(--surface-2));}
  .gate-icon svg{width:24px; height:24px; stroke:var(--gate-c,var(--accent)); fill:none; stroke-width:1.8;}
  .gate-body h2{font-size:18px;}
  .gate-body p{color:var(--muted); font-size:13px; margin-top:5px;}
  .error-msg{background:rgba(239,68,68,.12); color:#f87171; font-size:12.5px; padding:8px 11px; border-radius:8px; margin-top:12px;}

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12.5px; font-weight:600; color:var(--muted);}
  .field input,.field select,.field textarea{border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:9px 11px; border-radius:9px; font-size:13.5px; font-family:inherit;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
  .formgrid{display:flex; flex-direction:column; gap:13px; margin-top:16px;}
  .formrow2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .formrow2{grid-template-columns:1fr;} }

  .grid2{display:grid; grid-template-columns:1.35fr .85fr; gap:16px; align-items:start; margin-bottom:16px;}
  @media (max-width:920px){ .grid2{grid-template-columns:1fr;} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line);}
  .card-head h3{font-size:14.5px;}
  .card-body{padding:16px 18px;}

  .tablewrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); padding:9px 18px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody td{padding:12px 18px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num,th.num{text-align:right;}
  .empty-row td{text-align:center; color:var(--muted); padding:30px 10px;}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700;}
  .chip-thu{background:rgba(34,197,94,.15); color:#4ade80;}
  .chip-chi{background:rgba(239,68,68,.15); color:#f87171;}
  .chip-neutral{background:var(--surface-3); color:var(--muted);}
  .chip-task{background:rgba(245,158,11,.15); color:#fbbf24;}
  .chip-danger{background:rgba(239,68,68,.15); color:#f87171;}

  .progress-track{width:100%; height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden;}
  .progress-fill{height:100%; border-radius:99px;}

  .row-actions{display:flex; gap:12px; justify-content:flex-end; align-items:center;}
  .link-btn{font-size:12.5px; font-weight:700; background:none; border:none; color:var(--accent); padding:0; display:inline-block; transition:transform .14s ease;}
  .link-btn:hover{transform:translateY(-1px);}
  .link-btn.danger{color:#f87171;}
  .link-btn:hover{text-decoration:underline;}
  .confirm-wrap{display:flex; gap:8px; align-items:center; font-size:12px;}

  .chartbox{padding:16px 18px;}
  .chart-canvas-wrap{position:relative; height:230px;}

  .activity-row{display:flex; align-items:center; gap:11px; padding:9px 2px;}
  .activity-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex:none;}
  .activity-icon svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8;}
  .activity-mid{flex:1; min-width:0;}
  .activity-title{font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .activity-meta{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .activity-right{font-size:12.5px; font-weight:700; white-space:nowrap;}

  .admin-list{display:flex; flex-direction:column; gap:10px;}
  .admin-row{display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--line); border-radius:11px; padding:11px 14px; background:var(--surface-2);}
  .admin-row .name{font-weight:700; font-size:13.5px;}
  .admin-row .meta{font-size:12px; color:var(--muted); margin-top:2px;}

  .filter-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 18px; border-bottom:1px solid var(--line);}
  .filter-bar select, .filter-bar input{border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:7px 10px; border-radius:8px; font-size:12.5px; font-family:inherit;}
  .filter-bar select:focus, .filter-bar input:focus{border-color:var(--accent);}

  .photo-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  .photo-thumb{position:relative; width:64px; height:64px; border-radius:9px; overflow:hidden; border:1px solid var(--line); flex:none;}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-thumb button{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.65); color:#fff; border:none; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
  .photo-hint{font-size:11.5px; color:var(--muted-2); margin-top:6px;}

  .photo-strip{display:flex; align-items:center; gap:5px; margin-top:6px;}
  .photo-chip{width:26px; height:26px; border-radius:7px; object-fit:cover; border:1px solid var(--line); cursor:pointer; flex:none; transition:transform .14s ease, border-color .14s ease;}
  .photo-chip:hover{border-color:var(--accent); transform:scale(1.15);}
  .photo-more{font-size:11px; color:var(--muted); font-weight:700;}

  .total-row td{border-top:2px solid var(--line); background:var(--surface-2);}

  .lightbox-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:100; display:flex; align-items:center; justify-content:center; padding:30px;}
  .lightbox-backdrop img{max-width:90vw; max-height:88vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.5); display:block;}
  .lightbox-close{position:fixed; top:20px; right:24px; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.14); color:#fff; border:none; font-size:20px;}
  .lightbox-close:hover{background:rgba(255,255,255,.24);}

  @media (max-width:900px){
    .app-shell{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:sticky; flex-direction:row; align-items:center; padding:10px 14px; gap:14px; overflow-x:auto;}
    .brand{padding:0; flex:none;}
    .brand-sub{display:none;}
    .sidebar-nav{flex-direction:row; flex:1;}
    .navitem span{display:none;}
    .navitem{padding:10px;}
    .sidebar-spacer{display:none;}
    .sidebar-user{border-top:none; margin-top:0; padding:0;}
    .sidebar-user .info{display:none;}
    .topbar{padding:12px 16px;}
    .search-box{max-width:170px;}
    .page{padding:22px 16px 56px;}
  }
</style>

</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-7h6v7"/></svg>
      </div>
      <div>
        <div class="brand-name">Sổ Công Trình</div>
        <div class="brand-sub">Tài chính · Kho vật tư · Thi công</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="navTabs"></nav>
    <div id="syncStatusWrap"></div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-user" id="sidebarUser"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <label class="search-box">

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; } }

/* ---------- backend sync (Google Sheets qua Apps Script) ----------
   Dán link Web App (.../exec) sau khi triển khai Apps Script vào đây.
   Để trống thì app chạy hoàn toàn bằng LocalStorage như bản xem trước hiện tại. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwMy7whc6j2ZpP_bmbqWO1e7VL0p_TFYy1ecZkBRUhAfSQfQ-oV-AwiOy2wCksxnMe-/exec';

let jsonpCounter = 0;
function apiGet(action){
  return new Promise((resolve, reject) => {
    if(!API_URL){ reject(new Error('no API_URL')); return; }
    const cbName = 'sctCb' + (++jsonpCounter);
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 25000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timeout); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error('network error')); };
    script.src = API_URL + '?action=' + encodeURIComponent(action) + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}
async function apiPost(action, data){
  /* Apps Script Web App không trả header CORS ổn định nên fetch() thường
     không đọc lại được response — dùng no-cors để request vẫn gửi đi và
     Apps Script vẫn ghi được, chấp nhận không đọc được kết quả trả về.
     Vì vậy các thao tác ghi ở đây chạy kiểu "best-effort": lưu Local trước
     (luôn thành công ngay), rồi bắn lên Sheets nền — lần tải trang sau sẽ
     tự đồng bộ lại đầy đủ để đối chiếu. */
  await fetch(API_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, data))
  });
  return { status:'success' };
}
function syncWrite(action, payload){
  if(!API_URL) return;
  setSyncStatus('syncing');
  apiPost(action, payload)
    .then(()=> setSyncStatus('online'))
    .catch(()=> setSyncStatus('offline'));
}
function setSyncStatus(status){
  state.syncStatus = status;
  renderSyncStatus();

function normalizeDate(v){
  if(v===''||v==null) return '';
  const s = String(v);
  const isoDt = s.match(/^(\d{4}-\d{2}-\d{2})T/);
  if(isoDt) return isoDt[1];
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const dmy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(dmy) return dmy[3]+'-'+dmy[2].padStart(2,'0')+'-'+dmy[1].padStart(2,'0');
  return s;
}
/* đọc trường không phân biệt hoa/thường của tiêu đề cột trong Sheets
   (VD: cột ghi "fullname" hay "FullName" đều nhận được đúng như "fullName") */
function pick(row, key){
  if(row[key] !== undefined) return row[key];
  const found = Object.keys(row).find(k => k.toLowerCase() === key.toLowerCase());
  return found !== undefined ? row[found] : undefined;
}
function normalizeUsers(rows){
  return rows.map(r => ({
    username:String(pick(r,'username')||''), password:String(pick(r,'password')||''),
    role: pick(r,'role')==='admin' ? 'admin' : 'editor',
    module:String(pick(r,'module')||''), fullName:String(pick(r,'fullName')||'')
  })).filter(u => u.username);
}
function normalizeFinance(rows){
  return rows.map(r => ({
    id:Number(pick(r,'id'))||0, type:pick(r,'type')==='chi'?'chi':'thu', category:String(pick(r,'category')||''),
    amount:Number(pick(r,'amount'))||0, date:normalizeDate(pick(r,'date')), note:String(pick(r,'note')||'')
  }));
}
function normalizeMaterials(rows){
  return rows.map(r => ({
    id:Number(pick(r,'id'))||0, name:String(pick(r,'name')||''), category:String(pick(r,'category')||''), unit:String(pick(r,'unit')||''),
    qty:Number(pick(r,'qty'))||0, price:Number(pick(r,'price'))||0, note:String(pick(r,'note')||'')
  }));
}
function normalizeConstruction(rows){
  return rows.map(r => ({
    id:Number(pick(r,'id'))||0, team:String(pick(r,'team')||''), task:String(pick(r,'task')||''), date:normalizeDate(pick(r,'date')),
    floor:String(pick(r,'floor')||''), workers:Number(pick(r,'workers'))||0, progress:Number(pick(r,'progress'))||0,
    note:String(pick(r,'note')||''),
    photos: pick(r,'photos') ? String(pick(r,'photos')).split(',').map(s=>s.trim()).filter(Boolean) : []
  }));
}
function normalizeStaffCt(rows){
  return rows.map(r => ({
    id:Number(pick(r,'id'))||0, name:String(pick(r,'name')||''), position:String(pick(r,'position')||''),
    phone:String(pick(r,'phone')||''), startDate:normalizeDate(pick(r,'startDate')), salary:Number(pick(r,'salary'))||0,
    status: pick(r,'status')==='nghi_viec' ? 'nghi_viec' : 'dang_lam', note:String(pick(r,'note')||'')
  }));
}
function normalizeStaffTd(rows){
  return rows.map(r => ({
    id:Number(pick(r,'id'))||0, name:String(pick(r,'name')||''), team:String(pick(r,'team')||''), role:String(pick(r,'role')||''),
    phone:String(pick(r,'phone')||''), startDate:normalizeDate(pick(r,'startDate')), wage:Number(pick(r,'wage'))||0,
    status: pick(r,'status')==='nghi_viec' ? 'nghi_viec' : 'dang_lam', note:String(pick(r,'note')||'')
  }));
}
async function syncAllFromServer(){
  if(!API_URL) return;
  setSyncStatus('syncing');
  try{
    const data = await apiGet('all');
    if(data.users) save(LS.users, normalizeUsers(data.users));
    if(data.finance) save(LS.finance, normalizeFinance(data.finance));
    if(data.materials) save(LS.materials, normalizeMaterials(data.materials));
    if(data.construction) save(LS.construction, normalizeConstruction(data.construction));
    if(data.staffCt) save(LS.staffCt, normalizeStaffCt(data.staffCt));
    if(data.staffTd) save(LS.staffTd, normalizeStaffTd(data.staffTd));
    setSyncStatus('online');
    render();
  }catch(err){
    setSyncStatus('offline');
  }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : '';
  const last = parts.length>1 ? parts[parts.length-1][0] : '';
  return (first+last).toUpperCase();
}

function resizeImageFile(file, maxDim){
  maxDim = maxDim || 900;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function onConPhotoInput(e){
  const files = Array.from(e.target.files||[]);
  const room = Math.max(0, 6 - state.conPhotoDraft.length);
  for(const file of files.slice(0, room)){
    const dataUrl = await resizeImageFile(file);
    state.conPhotoDraft.push(dataUrl);

  renderConPhotoGrid();
}

  const labels = { syncing:'Đang đồng bộ…', online:'Đã đồng bộ Sheets', offline:'Ngoại tuyến — dùng dữ liệu tạm' };
  const status = state.syncStatus==='local' ? 'syncing' : state.syncStatus;
  wrap.innerHTML = `
    <div class="sync-status">
      <span class="sync-dot ${status}"></span>
      <span class="sync-label">${labels[status]||''}</span>

function applySearch(rows, fields){
  const q = (state.search||'').trim().toLowerCase();

  return rows.filter(r => fields.some(f => String(r[f]||'').toLowerCase().includes(q)));
}

function doLogin(e, wantModule){
  e.preventDefault();
  const f = e.target;
  const username = f.username.value.trim();
  const password = f.password.value;
  const users = load(LS.users, []);
  const u = users.find(x=>x.username===username && x.password===password);
  if(!u){ state.err.denied='Sai tên đăng nhập hoặc mật khẩu.'; render(); return false; }
  setSession({username:u.username, role:u.role, module:u.module, fullName:u.fullName});
  if(wantModule && !canAccess(wantModule)){
    state.err.denied = `Tài khoản "${u.fullName}" không có quyền truy cập mục "${MODULES[wantModule].label}".`;
  } else {
    state.err.denied = null;
  }
  render();
  playPageAnim();
  return false;
}

/* ---------- TÀI CHÍNH ---------- */
function financeCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.finance, []);
  const payload = {
    type: f.type.value,
    category: f.category.value.trim(),
    amount: Number(f.amount.value)||0,
    date: f.date.value,
    note: f.note.value.trim()
  };
  if(state.edit.tai_chinh){
    payload.id = state.edit.tai_chinh;
    const idx = rows.findIndex(r=>r.id===state.edit.tai_chinh);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows);
    rows.push(payload);
  }
  save(LS.finance, rows);
  syncWrite('saveFinance', {data: payload});
  state.edit.tai_chinh = null;
  state.formOpen.tai_chinh = false;
  render();
}

function financeDelete(id){

/* gửi bản ghi thi công lên Apps Script — ảnh mới (data:) upload lên Drive, ảnh cũ (http) giữ nguyên link */
function syncConstruction(payload){
  if(!API_URL) return;
  const existing = payload.photos.filter(p=>!p.startsWith('data:'));
  const fresh = payload.photos.filter(p=>p.startsWith('data:'));
  const newPhotos = fresh.map(dataUrl=>{
    const [meta, b64] = dataUrl.split(',');
    const mimeType = (meta.match(/data:(.*?);base64/)||[])[1] || 'image/jpeg';
    return { base64:b64, mimeType, fileName:'thi_cong_'+payload.id+'_'+Date.now()+'.jpg' };
  });
  setSyncStatus('syncing');
  apiPost('saveConstruction', { data: {...payload, photos: existing.join(',')}, newPhotos })
    .then(res=>{
      if(res && res.status==='success'){
        setSyncStatus('online');
      } else {
        setSyncStatus('offline');
      }
    })
    .catch(()=> setSyncStatus('offline'));
}

    }

}

/* ---------- NHÂN SỰ TỔ ĐỘI ---------- */
const TEAM_ROLE_OPTIONS = ['Tổ trưởng','Thợ chính','Thợ phụ'];
function staffTdCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.staffTd, []);
  const payload = {
    name:f.name.value.trim(), team:f.team.value.trim(), role:f.role.value, phone:f.phone.value.trim(),
    startDate:f.startDate.value, wage:Number(f.wage.value)||0, status:f.status.value, note:f.note.value.trim()
  };
  if(state.edit.nhansu_td){
    payload.id = state.edit.nhansu_td;
    const idx = rows.findIndex(r=>r.id===state.edit.nhansu_td);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows);
    rows.push(payload);
  }
  save(LS.staffTd, rows);
  syncWrite('saveStaffTd', {data: payload});
  state.edit.nhansu_td=null; state.formOpen.nhansu_td=false; render();
}
function staffTdEdit(id){ state.edit.nhansu_td=id; state.formOpen.nhansu_td=true; render(); }
function staffTdDelete(id){
  save(LS.staffTd, load(LS.staffTd,[]).filter(r=>r.id!==id));
  syncWrite('deleteStaffTd', {id});
  state.confirmId=null; render();
}
function staffTdChart(rows){
  const el = document.getElementById('staffTdChart');
  if(!el) return;
  if(state.charts.staffTd) state.charts.staffTd.destroy();
  const ink = getComputedStyle(document.body).getPropertyValue('--muted').trim();
  const byTeam = {};
  rows.forEach(r=>{ byTeam[r.team||'Khác'] = (byTeam[r.team||'Khác']||0)+1; });
  const labels = Object.keys(byTeam);
  state.charts.staffTd = new Chart(el, {
    type:'bar',
    data:{ labels, datasets:[{ data: labels.map(l=>byTeam[l]), backgroundColor: MODULES.nhansu_td.color, borderRadius:6, maxBarThickness:26 }] },
    options:{
      indexAxis:'y',
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed.x+' người'}}},
      scales:{ x:{ticks:{color:ink, stepSize:1}, grid:{color:'rgba(255,255,255,.08)'}}, y:{ticks:{color:ink}, grid:{display:false}} }
    }
  });
}

  const rows = applySearch(allRows, ['name','team','role','phone','note']);

      ${kpiCard('spark-st1','kpi-purple','Số tổ đội', String(teamCount), allRows.length+' người')}
      ${kpiCard('spark-st2','kpi-green','Đang làm việc', String(activeCount), allRows.length+' tổng')}
    </div>

    ${state.formOpen.nhansu_td ? `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>${editing?'Sửa công nhân':'Thêm công nhân mới'}</h3></div>
      <div class="card-body">
        <form onsubmit="staffTdCreateOrUpdate(event)">
          <div class="formrow2">
            <div class="field"><label>Họ tên</label><input name="name" required value="${editing?esc(editing.name):''}"></div>
            <div class="field"><label>Tổ đội</label><input name="team" required placeholder="VD: Tổ 1 - Anh Bình" value="${editing?esc(editing.team):''}"></div>
          </div>

              <select name="role">
                ${TEAM_ROLE_OPTIONS.map(r=>`<option value="${r}" ${editing&&editing.role===r?'selected':''}>${r}</option>`).join('')}
              </select>

            <div class="field"><label>Số điện thoại</label><input name="phone" value="${editing?esc(editing.phone):''}"></div>
          </div>
          <div class="formrow2">
            <div class="field"><label>Ngày vào tổ</label><input type="date" name="startDate" value="${editing?editing.startDate:new Date().toISOString().slice(0,10)}"></div>
            <div class="field"><label>Đơn giá công (đ/ngày)</label><input type="number" name="wage" min="0" step="10000" value="${editing?editing.wage:''}"></div>
          </div>
          <div class="field"><label>Trạng thái</label>
            <select name="status">
              ${Object.entries(STAFF_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${editing&&editing.status===k?'selected':''}>${l}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Ghi chú</label><input name="note" value="${editing?esc(editing.note):''}"></div>
          <div style="display:flex; gap:10px; margin-top:13px;">
            <button class="btn btn-accent" type="submit">${editing?'Lưu thay đổi':'Lưu công nhân'}</button>

    <div class="card">
      <div class="card-head"><h3>Danh sách công nhân</h3><span style="font-size:12px; color:var(--muted);">${rows.length} / ${allRows.length}</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Họ tên</th><th>Tổ đội</th><th>Vai trò</th><th>SĐT</th><th>Ngày vào tổ</th><th class="num">Đơn giá công</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody>
          ${rows.length===0?`<tr class="empty-row"><td colspan="8">${allRows.length===0?'Chưa có công nhân nào.':'Không tìm thấy kết quả phù hợp.'}</td></tr>`:
          rows.map(r=>`
            <tr>
              <td><b>${esc(r.name)}</b>${r.note?`<div style="color:var(--muted); font-size:12px; margin-top:2px;">${esc(r.note)}</div>`:''}</td>
              <td>${esc(r.team)}</td>
              <td>${esc(r.role)}</td>
              <td>${esc(r.phone)||'—'}</td>
              <td class="num" style="white-space:nowrap;">${vdate(r.startDate)}</td>

}

/* ---------- ADMIN: quản trị tài khoản ---------- */
function adminCreateUser(e){
  e.preventDefault();
  const f = e.target;
  const users = load(LS.users, []);
  const username = f.username.value.trim();
  if(users.some(u=>u.username===username)){ state.err.admin='Tên đăng nhập đã tồn tại.'; render(); return false; }
  const newUser = { username, password:f.password.value, role:'editor', module:f.module.value, fullName:f.fullName.value.trim() };
  users.push(newUser);
  save(LS.users, users);
  syncWrite('saveUser', {data: newUser});
  state.err.admin=null;
  render();
  return false;
}
function adminDeleteUser(username){
  save(LS.users, load(LS.users,[]).filter(u=>u.username!==username));
  syncWrite('deleteUser', {username});
  state.confirmId=null; render();
}
function renderAdmin(){
  const users = load(LS.users, []);
  document.getElementById('page').innerHTML = `
    <div class="section-head">
      <div>
        <span class="eyebrow">Quản trị</span>
        <h1>Quản trị tài khoản</h1>
        <p>Tạo tài khoản Editor và gán quyền truy cập đúng một module.</p>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-head"><h3>Danh sách tài khoản</h3></div>
        <div class="card-body admin-list">
          ${users.map(u=>`
            <div class="admin-row">
              <div>
                <div class="name">${esc(u.fullName)} <span style="color:var(--muted); font-weight:500;">(${esc(u.username)})</span></div>
                <div class="meta">${u.role==='admin'?'Quản trị viên · Toàn quyền':'Editor · '+ (MODULES[u.module]?MODULES[u.module].short:'—')}</div>
              </div>
              ${u.role==='admin' ? `<span class="chip chip-neutral">Bảo vệ</span>` : (state.confirmId===u.username ? `
                <span class="confirm-wrap">Chắc chắn?
                  <button class="link-btn danger" onclick="adminDeleteUser('${u.username}')">Xoá</button>
                  <button class="link-btn" onclick="state.confirmId=null; render();">Huỷ</button>
                </span>` : `<button class="link-btn danger" onclick="state.confirmId='${u.username}'; render();">Xoá</button>`)}
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Thêm tài khoản Editor</h3></div>
        <div class="card-body">
          <form onsubmit="return adminCreateUser(event)">
            <div class="formgrid">
              <div class="field"><label>Họ tên</label><input name="fullName" required></div>
              <div class="field"><label>Tên đăng nhập</label><input name="username" required></div>
              <div class="field"><label>Mật khẩu</label><input name="password" type="text" required></div>
              <div class="field"><label>Module được phép truy cập</label>
                <select name="module">
                  ${Object.entries(MODULES).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join('')}
                </select>
              </div>
              ${state.err.admin?`<div class="error-msg">${esc(state.err.admin)}</div>`:''}
              <button class="btn btn-accent" type="submit">Tạo tài khoản</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;
}

/* ---------- router / render ---------- */
function render(){
  renderChrome();
  if(state.view==='home') return renderHome();
  if(state.view==='admin'){
    const s=getSession();
    if(!s || s.role!=='admin'){ state.view='home'; return renderHome(); }
    return renderAdmin();
  }
  if(['tai_chinh','kho','thi_cong','nhansu_ct','nhansu_td'].includes(state.view)){
    if(!canAccess(state.view)) return renderGate(state.view);
    if(state.view==='tai_chinh') return renderFinance();
    if(state.view==='kho') return renderKho();
    if(state.view==='thi_cong') return renderThiCong();
    if(state.view==='nhansu_ct') return renderNhanSuCT();
    if(state.view==='nhansu_td') return renderNhanSuTD();
  }
}
render();
syncAllFromServer();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
</script>
