<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuấn Tú Group</title>
<meta name="description" content="Quản lý tài chính, kho vật tư và thi công dự án">
<meta name="theme-color" content="#0a0e16">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuấn Tú Group">
<style>html,body{margin:0;padding:0;background:#0a0e16;}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0e16;
    --sidebar-bg:#0c1019;
    --surface:#121722;
    --surface-2:#171e2b;
    --surface-3:#1d2536;
    --ink:#eef2f7;
    --muted:#8792a3;
    --muted-2:#5b6577;
    --line:rgba(255,255,255,.08);
    --accent:#f59e0b;
    --accent-ink:#241a08;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.6);
    --radius:14px;
    --accent-2:#f59e0b;
    --accent-2-soft:rgba(245,158,11,.15);
    --glow-accent:0 10px 30px -5px rgba(245,158,11,.18);
    --glass-bg:rgba(12,21,43,.92);
    --glass-blur:blur(14px);
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .label-mono{font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.18em; font-weight:700; font-size:11.5px; color:var(--accent-2); text-shadow:0 2px 6px rgba(245,158,11,.25);}
  h1,h2,h3{text-wrap:balance; margin:0; font-weight:700;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- shell (top nav) ---------- */
  .app-shell{display:flex; flex-direction:column; min-height:100vh;}
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}

  .topnav{position:sticky; top:0; z-index:20; background:var(--glass-bg); backdrop-filter:var(--glass-blur); border-bottom:1px solid rgba(245,158,11,.15); padding:12px 26px; display:flex; align-items:center; gap:18px;}
  .topnav::after{content:''; position:absolute; left:0; right:0; top:100%; height:16px; background:linear-gradient(to bottom, rgba(245,158,11,.16), transparent); pointer-events:none;}

  .brand{display:flex; align-items:center; gap:10px; flex:none;}
  .brand-badge{width:36px; height:36px; border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 4px 14px -4px rgba(0,0,0,.4); padding:5px;}
  .brand-badge img{width:100%; height:100%; object-fit:contain; display:block;}
  .brand-name{font-weight:800; font-size:15px; color:#fff; letter-spacing:.2px; white-space:nowrap;}
  .brand-sub{font-size:10.5px; color:var(--muted); margin-top:-1px; white-space:nowrap;}

  .topnav-menu{display:flex; align-items:center; justify-content:safe center; gap:10px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0;}
  .topnav-menu::-webkit-scrollbar{display:none;}
  .navitem{display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px; color:var(--muted); font-size:13px; font-weight:600; white-space:nowrap; background:var(--surface); border:1px solid var(--line); box-shadow:0 2px 6px -2px rgba(0,0,0,.3); flex:none; transition:background-color .16s ease, color .16s ease, transform .16s ease, border-color .16s ease;}
  .navitem:active{transform:scale(.97);}
  .navitem svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none;}
  .navitem span{white-space:nowrap;}
  .navitem:hover{background:var(--surface-2); color:var(--ink); border-color:var(--muted-2); transform:translateY(-1px);}
  .navitem.active{background:linear-gradient(180deg,#fbbf24,#d97706); border-color:rgba(180,83,9,.5); color:#241a08; font-weight:800;}
  .navitem .lock{width:11px; height:11px; opacity:.6; flex:none;}

  .topnav-right{margin-left:auto; display:flex; align-items:center; gap:10px; flex:none;}

  .sync-status{display:flex; align-items:center; gap:7px; padding:8px 12px; font-size:11.5px; color:var(--muted); background:rgba(255,255,255,.04); border:1px solid rgba(245,158,11,.2); backdrop-filter:blur(6px); border-radius:999px;}
  .sync-label{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sync-dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--muted-2);}
  .sync-refresh{background:none; border:none; color:var(--muted); padding:5px; border-radius:7px; display:flex; flex:none; transition:transform .5s ease, background-color .16s ease, color .16s ease;}
  .sync-refresh svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2;}
  .sync-refresh:hover{background:var(--surface-2); color:var(--ink);}
  .sync-refresh:active svg{transform:rotate(180deg);}
  .sync-refresh[disabled]{opacity:.5; cursor:default;}
  .sync-refresh[disabled] svg{animation:syncSpin .8s linear infinite;}
  @keyframes syncSpin{ to{ transform:rotate(360deg); } }
  .sync-dot.syncing{background:#f59e0b; animation:syncPulse 1s ease-in-out infinite;}
  .sync-dot.online{background:#22c55e;}
  .sync-dot.offline{background:#ef4444;}
  @keyframes syncPulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#f59e0b,#c2410c); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; color:#fff; flex:none;}

  /* ---------- subbar (tìm kiếm + nút hành động theo từng trang) ---------- */
  .subbar{display:flex; align-items:center; gap:16px; padding:14px 26px; border-bottom:1px solid var(--line);}
  .search-box{display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 13px; width:100%; max-width:320px; color:var(--muted);}
  .search-box:has(input:disabled){opacity:.5;}
  .search-box svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none;}
  .search-box input{background:none; border:none; outline:none; color:var(--ink); font-size:13.5px; width:100%; font-family:inherit;}
  .search-box input::placeholder{color:var(--muted-2);}
  #topbarAction{margin-left:auto;}
  #notifWrap{position:relative;}
  .bell{position:relative; width:38px; height:38px; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); transition:transform .16s ease, color .16s ease, border-color .16s ease;}
  .bell:hover{color:var(--ink); border-color:var(--muted-2); transform:translateY(-2px);}
  .bell .badge{position:absolute; top:-5px; right:-5px; background:#ef4444; color:#fff; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:99px; display:flex; align-items:center; justify-content:center; padding:0 4px; border:2px solid var(--bg);}
  .notif-panel{position:absolute; top:48px; right:0; width:270px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:8px; z-index:30;}
  .notif-head{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; padding:6px 8px;}
  .notif-row{display:flex; justify-content:space-between; gap:10px; padding:7px 8px; border-radius:8px; font-size:12.5px;}
  .notif-row:hover{background:var(--surface-2);}
  .notif-row b{color:#f87171;}
  .notif-empty{padding:10px 8px; font-size:12.5px; color:var(--muted);}

  #profileWrap{position:relative;}
  .profile-btn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 12px 5px 5px; transition:border-color .16s ease, transform .16s ease;}
  .profile-btn:hover{border-color:var(--muted-2); transform:translateY(-2px);}
  .profile-btn-name{font-size:13px; font-weight:700; color:var(--ink); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .profile-chevron{width:14px; height:14px; stroke:var(--muted); fill:none; stroke-width:2; flex:none;}
  .profile-panel{position:absolute; top:48px; right:0; width:220px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:8px; z-index:30;}
  .profile-panel-head{padding:8px 10px 10px; border-bottom:1px solid var(--line); margin-bottom:6px;}
  .profile-panel-head b{display:block; font-size:13.5px; color:var(--ink);}
  .profile-panel-head span{font-size:11.5px; color:var(--muted);}
  .profile-panel-item{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:9px 10px; border-radius:8px; font-size:13px; font-weight:600; color:var(--ink); background:none; border:none; transition:background-color .14s ease;}
  .profile-panel-item svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none;}
  .profile-panel-item:hover{background:var(--surface-2);}
  .profile-panel-item.danger{color:#f87171;}

  #projectWrap{position:relative;}
  .project-btn{display:flex; align-items:center; gap:7px; background:rgba(245,158,11,.1); border:1px solid rgba(245,158,11,.35); border-radius:999px; padding:7px 12px; color:var(--ink); font-size:13px; font-weight:700; max-width:240px; transition:border-color .16s ease, transform .16s ease;}
  .project-btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .project-pin{width:15px; height:15px; stroke:var(--accent); fill:none; stroke-width:2; flex:none;}
  .project-btn-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .project-panel{position:absolute; top:46px; right:0; width:260px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:8px; z-index:30;}
  .project-item{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; text-align:left; padding:9px 10px; border-radius:8px; font-size:13px; font-weight:600; color:var(--ink); background:none; border:none; transition:background-color .14s ease;}
  .project-item:hover{background:var(--surface-2);}
  .project-item.active{background:var(--accent-2-soft); color:#fbbf24;}
  .project-item-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
  .home-hero-project{display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--ink); margin-bottom:14px; padding:6px 14px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid var(--line);}
  .home-hero-project svg{width:15px; height:15px; stroke:var(--accent); fill:none; stroke-width:2;}
  @media (max-width:900px){ .project-btn{max-width:150px; padding:7px 10px;} .project-panel{right:auto; left:0;} }
  @media (max-width:560px){ .home-cta{max-width:100%;} .home-cta-text{white-space:normal;} }
  .bill-in{width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:7px 9px; border-radius:7px; font-size:13px; font-family:inherit;}
  .bill-in:focus{border-color:var(--accent); outline:none;}
  .bill-in.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
  .field select{width:100%;}
  /* màn hình vừa: thu gọn bớt thanh trên để menu không bị che */
  @media (max-width:1700px) and (min-width:901px){ .sync-label{display:none;} .project-btn{max-width:180px;} .navitem:not(.active) span{display:none;} .navitem:not(.active){padding:10px 12px;} }
  @media (max-width:1180px) and (min-width:901px){ .navitem span{display:none;} .navitem{padding:10px 12px;} .project-btn{max-width:140px;} }

  .btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:9px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:transform .14s ease, border-color .14s ease, filter .14s ease;}
  .btn:hover{border-color:var(--accent); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-accent{border-radius:999px; background:linear-gradient(180deg,#fbbf24,#d97706); border:1px solid rgba(180,83,9,.5); color:var(--accent-ink); box-shadow:0 6px 18px rgba(245,158,11,.35), inset 0 1.5px 1.5px rgba(255,255,255,.35), 0 -1px 0 1px rgba(180,83,9,.3); font-weight:800; text-transform:uppercase; letter-spacing:.03em; transition:transform .2s ease, box-shadow .2s ease;}
  .btn-accent:hover{transform:translateY(-1px); box-shadow:0 9px 22px rgba(245,158,11,.5), inset 0 1.5px 1.5px rgba(255,255,255,.4), 0 -1px 0 1px rgba(180,83,9,.4);}
  .btn-accent:active{transform:scale(.97);}

  .page{padding:26px 34px 64px;}
  .page.page-home{display:flex; flex-direction:column; flex:1; padding-bottom:18px;}
  .page.page-home .home-content{flex:1; display:flex; flex-direction:column;}
  .page.page-home .home-cta{margin-top:auto;}
  @keyframes pageEnter{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .page.anim{ animation:pageEnter .32s cubic-bezier(.22,.61,.36,1); }
  @media (prefers-reduced-motion: reduce){ .page.anim{ animation:none; } }
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px;}
  .subtab-bar{display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--line); overflow-x:auto;}
  .subtab{padding:11px 14px; margin-bottom:-1px; background:none; border:none; border-bottom:2px solid transparent; color:var(--muted); font-weight:600; font-size:13.5px; white-space:nowrap; transition:color .14s ease, border-color .14s ease;}
  .subtab:hover{color:var(--ink);}
  .subtab.active{color:#fff; border-bottom-color:var(--subtab-c,var(--accent));}

  .kpi-grid.cols-5{grid-template-columns:repeat(5,1fr);}
  @media (max-width:1280px){ .kpi-grid.cols-5{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:560px){ .kpi-grid.cols-5{grid-template-columns:1fr;} }

  .tq-filterbar{display:flex; align-items:center; gap:16px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 18px; margin-bottom:20px;}
  .period-toggle{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; flex:none;}
  .period-toggle button{padding:7px 13px; border-radius:7px; background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:600; transition:background-color .14s ease, color .14s ease;}
  .period-toggle button.active{background:var(--surface-3); color:#fff;}
  .period-toggle button:hover{color:var(--ink);}
  .tq-range{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
  .tq-range input[type=date]{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:7px 9px; font-size:12.5px; font-family:inherit;}
  .tq-loc{margin-left:auto; display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--muted);}
  .tq-loc b{color:var(--ink);}
  .tq-loc input[type=text]{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--ink); padding:6px 9px; font-size:12.5px; font-family:inherit;}
  .worklog-item{padding:13px 0; border-bottom:1px solid var(--line);}
  .worklog-item:last-child{border-bottom:none;}
  .worklog-head{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap;}
  .worklog-date{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px;}
  .worklog-text{font-size:13px; color:#c3cbda; line-height:1.6; white-space:pre-line;}
  .section-head h1{font-size:23px;}
  .section-head p{color:var(--muted); font-size:13.5px; margin-top:4px;}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block;}

  /* ---------- kpi gradient cards ---------- */
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
  .kpi-grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:1080px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .kpi-grid{grid-template-columns:1fr;} }
  .kpi-card{position:relative; overflow:hidden; border-radius:16px; padding:18px 20px 56px; min-height:120px; color:#fff; display:flex; flex-direction:column; gap:8px; border:1px solid rgba(255,255,255,.08); transition:transform .16s ease, box-shadow .16s ease;}
  .kpi-card:hover{transform:translateY(-3px); box-shadow:0 16px 34px -12px var(--kpi-glow, rgba(0,0,0,.55));}
  .kpi-card::before{content:'';position:absolute; inset:0; background:radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,.18), transparent 60%); pointer-events:none;}
  .kpi-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:relative; z-index:1;}
  .kpi-top-left{display:flex; align-items:center; gap:8px; min-width:0;}
  .kpi-icon{width:28px; height:28px; border-radius:8px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; flex:none;}
  .kpi-icon svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2;}
  .kpi-label{font-size:12.5px; font-weight:700; opacity:.92;}
  .kpi-trend{font-size:10.5px; font-weight:800; background:rgba(255,255,255,.2); padding:3px 8px; border-radius:99px; white-space:nowrap; position:relative; z-index:1;}
  .kpi-trend.up{background:rgba(34,197,94,.3); color:#dcfce7;}
  .kpi-trend.down{background:rgba(239,68,68,.3); color:#fee2e2;}
  @keyframes skeletonPulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  .skeleton-bar{display:inline-block; height:1em; border-radius:5px; background:rgba(255,255,255,.28); animation:skeletonPulse 1.3s ease-in-out infinite;}
  .kpi-value{font-size:24px; font-weight:800; position:relative; z-index:1;}
  .kpi-spark{position:absolute; left:0; right:0; bottom:0; height:52px; width:100%;}
  .kpi-blue{background:linear-gradient(135deg,#2f6fed 0%,#15316b 100%); --kpi-glow:rgba(47,111,237,.45);}
  .kpi-orange{background:linear-gradient(135deg,#f9812f 0%,#7c2d12 100%); --kpi-glow:rgba(249,129,47,.45);}
  .kpi-purple{background:linear-gradient(135deg,#a855f7 0%,#581c87 100%); --kpi-glow:rgba(168,85,247,.45);}
  .kpi-green{background:linear-gradient(135deg,#13ba86 0%,#065f46 100%); --kpi-glow:rgba(19,186,134,.45);}
  .kpi-red{background:linear-gradient(135deg,#ef4444 0%,#7f1d1d 100%); --kpi-glow:rgba(239,68,68,.45);}

  /* ---------- home (ảnh nền cố định toàn màn hình, module dạng danh sách dọc đè lên) ---------- */
  .home-bg-fixed{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .home-bg-fixed img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%;}
  .home-bg-overlay{position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,10,18,.55) 0%, rgba(6,10,18,.68) 40%, rgba(6,10,18,.85) 100%);}
  .home-content{position:relative; z-index:1;}
  .home-hero-inner{position:relative; text-align:center; padding:70px 24px 40px; max-width:760px; margin:0 auto;}
  .home-hero-tag{margin-bottom:14px;}
  .home-hero-title{font-size:44px; line-height:1.08; font-weight:800; letter-spacing:-.01em; color:#fff; text-wrap:balance; text-transform:uppercase; margin-bottom:14px;}
  .home-hero-eyebrow{font-size:12px; color:var(--muted); opacity:.85; text-align:center; margin-bottom:22px;}
  .home-hero-eyebrow b{color:var(--ink); font-weight:700;}
  .home-counter{display:inline-flex; align-items:center; gap:14px; background:rgba(255,255,255,.07); border:1px solid rgba(245,158,11,.25); border-radius:14px; padding:13px 18px; backdrop-filter:blur(8px); box-shadow:var(--glow-accent);}
  .home-counter-dot{width:8px; height:8px; border-radius:50%; background:#f59e0b; flex:none; box-shadow:0 0 0 4px rgba(245,158,11,.16); animation:syncPulse 1.8s ease-in-out infinite;}
  .home-counter-num{font-size:23px; font-weight:800; color:#f59e0b; letter-spacing:.2px;}
  .home-counter-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .home-counter-edit{background:none; border:none; color:var(--muted); padding:5px; border-radius:7px; display:inline-flex; margin-left:2px; transition:background-color .14s ease, color .14s ease;}
  .home-counter-edit:hover{background:var(--surface-2); color:var(--ink);}

const API_SECRET = 'adgzqusrypkn5mijxfbh6v749o8tl0c3w12e';

let jsonpCounter = 0;
function apiGet(action){
  return new Promise((resolve, reject) => {
    if(!API_URL){ reject(new Error('no API_URL')); return; }
    const cbName = 'sctCb' + (++jsonpCounter);
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 25000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timeout); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error('network error')); };
    script.src = API_URL + '?action=' + encodeURIComponent(action) + '&secret=' + encodeURIComponent(API_SECRET) + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}
/* ghi qua GET+JSONP — đọc được kết quả thật (khác apiPost no-cors ở dưới),
   nên biết chắc thành công hay lỗi, phục vụ tự động thử lại khi bận khoá. */
function apiGetWrite(action, req){
  return new Promise((resolve, reject) => {
    if(!API_URL){ reject(new Error('no API_URL')); return; }
    const cbName = 'sctCb' + (++jsonpCounter);
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timeout); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error('network error')); };
    script.src = API_URL + '?action=' + encodeURIComponent(action) + '&secret=' + encodeURIComponent(API_SECRET) + '&req=' + encodeURIComponent(JSON.stringify(req)) + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}
async function apiPost(action, data){
  /* Chỉ dùng khi payload có ảnh mới (base64) — quá dài để gửi qua GET.
     Apps Script Web App không trả header CORS ổn định nên fetch() thường
     không đọc lại được response — dùng no-cors để request vẫn gửi đi và
     Apps Script vẫn ghi được, chấp nhận không đọc được kết quả trả về
     (không biết chắc thành công hay lỗi, không thử lại được). */
  await fetch(API_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action, secret:API_SECRET}, data))
  });
  return { status:'success' };
}
/* đọc kết quả 1 lần gọi AI trước đó (đã POST xong, xử lý xong ở server) — qua GET+JSONP nên đọc
   được response thật, và ảnh không phải gửi lại lần nữa (server đã xử lý và lưu tạm kết quả). */
function apiGetParams(action, params){
  return new Promise((resolve, reject) => {
    if(!API_URL){ reject(new Error('no API_URL')); return; }
    const cbName = 'sctCb' + (++jsonpCounter);
    const script = document.createElement('script');
    const timeout = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 25000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timeout); }
    window[cbName] = (data)=>{ cleanup(); resolve(data); };
    script.onerror = ()=>{ cleanup(); reject(new Error('network error')); };
    const qs = Object.entries(params||{}).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
    script.src = API_URL + '?action=' + encodeURIComponent(action) + '&secret=' + encodeURIComponent(API_SECRET) + (qs?'&'+qs:'') + '&callback=' + cbName;
    document.body.appendChild(script);
  });
}
/* gọi lại fn() tối đa (1+extraAttempts) lần nếu lỗi hoặc server báo status:'error',
   có chờ giãn cách giữa các lần — dùng cho các thao tác ghi quan trọng khi nhiều
   người cùng dùng app một lúc dễ gặp tình trạng bận khoá ghi tạm thời. */
function withRetry(fn, delaysMs){
  return new Promise((resolve)=>{
    let attempt = 0;
    function tryOnce(){
      fn().then(res=>{
        if(res && res.status==='error'){ throw new Error(res.message||'server error'); }
        resolve({ok:true, res});
      }).catch(err=>{
        if(attempt >= delaysMs.length){ resolve({ok:false, err}); return; }
        const delay = delaysMs[attempt];
        attempt++;
        setTimeout(tryOnce, delay);
      });
    }
    tryOnce();
  });
}

/* ---------- NHIỀU CÔNG TRÌNH ----------
   Các tab dữ liệu "theo công trình" (thu chi, thi công, vật tư chính/phụ, nhân sự tổ đội,
   công nhật khấu trừ, phạt) có thêm cột projectId. Dòng cũ chưa có projectId được hiểu là
   thuộc công trình mặc định (id "1") — không phải sửa gì trên Sheets.
   Trình duyệt giữ bản ĐẦY ĐỦ mọi công trình ở khoá "sct_raw_*", còn các khoá LS cũ
   (sct_finance, sct_construction...) chỉ chứa phần của công trình đang chọn — nhờ vậy mọi
   màn hình cũ tự động chỉ thấy dữ liệu của công trình đang chọn mà không phải sửa từng màn hình. */
const DEFAULT_PROJECT_ID = '1';
const SCOPED_TABLES = { // khoá trong payload server -> tên khoá trong LS
  finance:'finance', construction:'construction', staffTd:'staffTd',
  vatTuChinh:'vatTuChinh', vatTuPhu:'vatTuPhu', congKhauTru:'conKhauTru', congPhat:'conPhat'
};
const SCOPED_ACTION_RE = /^(save|delete)(Finance|Construction|StaffTd|VatTuChinh|VatTuPhu|KhauTru|Phat)$/;
const SCOPED_PID_KEY = 'sct_scoped_pid'; // công trình mà các khoá LS cũ đang chứa dữ liệu
function rawGet(k){ return load('sct_raw_'+k, null); }
function rawSet(k, rows){ return save('sct_raw_'+k, rows); }
function rowProjectId(r){ return String((r && r.projectId) || '') || DEFAULT_PROJECT_ID; }
function normalizeProjects(rows){
  return rows.map(r => ({
    id:String(pick(r,'id')||'').trim(), name:String(pick(r,'name')||'').trim(),
    location:String(pick(r,'location')||''), startDate:normalizeDate(pick(r,'startDate')),
    status: pick(r,'status')==='done' ? 'done' : 'active', note:String(pick(r,'note')||''),
    khoMin:String(pick(r,'khoMin')||''), tinhCongTu:normalizePeriodStr(pick(r,'tinhCongTu'))
  })).filter(p => p.id && p.name);
}
function normalizePeriodStr(v){ // dùng trước khi normalizePeriod (khai báo ở module Thanh toán) sẵn sàng
  const m = String(v==null?'':v).match(/^(\d{4})-(\d{1,2})/); return m ? m[1]+'-'+m[2].padStart(2,'0') : '';
}
/* danh sách công trình — tab "CongTrinh" trên Sheets. Chưa có dòng nào (bản cũ) thì coi như
   chỉ có 1 công trình mặc định, lấy ngày khởi công/địa điểm từ cài đặt cũ (tab CaiDat). */
function getProjects(){
  const list = load(LS.projects, null);
  if(Array.isArray(list) && list.length) return list;
  const st = load(LS.settings, {}) || {};
  return [{ id:DEFAULT_PROJECT_ID, name:'Công trình hiện tại', location:st.projectLocation||'', startDate:st.projectStartDate||'', status:'active', note:'' }];
}
/* công trình tài khoản đang đăng nhập được xem: admin xem tất cả; tài khoản khác nếu cột
   "projects" trống thì xem tất cả (giữ nguyên như trước khi có tính năng này), có ghi thì chỉ
   xem đúng các công trình được ghi. */
function accessibleProjects(){
  const all = getProjects();
  const s = getSession();
  if(!s || s.role==='admin') return all;

function currentProjectId(){
  const acc = accessibleProjects();
  if(!acc.length) return ''; // không được xem công trình nào -> không khớp dòng dữ liệu nào
  const saved = String(load(LS.currentProject, '') || '');
  if(acc.some(p => String(p.id)===saved)) return saved;
  const firstActive = acc.find(p => p.status!=='done') || acc[0];
  return String(firstActive.id);
}
function currentProject(){ const pid = currentProjectId(); return getProjects().find(p => String(p.id)===pid) || null; }
/* gộp phần đang hiển thị (có thể vừa thêm/sửa/xoá trên máy) trở lại bản đầy đủ */
function mergeScopedBack(){
  const pid = String(load(SCOPED_PID_KEY, '') || '');
  if(!pid) return;
  Object.values(SCOPED_TABLES).forEach(k => {
    const raw = rawGet(k);
    if(!raw) return;
    const cur = load(LS[k], []).map(r => r.projectId ? r : {...r, projectId:pid});
    rawSet(k, raw.filter(r => rowProjectId(r)!==pid).concat(cur));
  });
}
/* ghi phần của công trình đang chọn vào các khoá LS cũ + ngày khởi công/địa điểm của công trình đó */
function applyProjectScope(){
  const pid = currentProjectId();
  Object.values(SCOPED_TABLES).forEach(k => {
    const raw = rawGet(k);
    if(raw) save(LS[k], raw.filter(r => rowProjectId(r)===pid));
  });
  const p = currentProject();
  const st = load(LS.settings, {}) || {};
  st.projectStartDate = p ? (p.startDate||'') : '';
  st.projectLocation = p ? (p.location||'') : '';
  save(LS.settings, st);
  save(SCOPED_PID_KEY, pid);
}
/* chạy 1 lần lúc mở app: tạo bản đầy đủ từ dữ liệu đang có (lần đầu sau khi nâng cấp), và
   nếu công trình đang chọn khác phần đang nằm trong LS thì đổi cho khớp. */
function initProjectScope(){
  const prevPid = String(load(SCOPED_PID_KEY, '') || '') || DEFAULT_PROJECT_ID;
  Object.values(SCOPED_TABLES).forEach(k => {
    if(rawGet(k)==null) rawSet(k, load(LS[k], []).map(r => r.projectId ? r : {...r, projectId:prevPid}));
  });
  save(SCOPED_PID_KEY, prevPid);
  if(prevPid !== currentProjectId()){ mergeScopedBack(); applyProjectScope(); }
}
function switchProject(id){
  mergeScopedBack();
  save(LS.currentProject, String(id));
  applyProjectScope();
  state.projectMenuOpen = false;
  Object.keys(state.edit).forEach(k => state.edit[k]=null);
  Object.keys(state.formOpen).forEach(k => state.formOpen[k]=false);
  state.pagination = {}; state.confirmId = null; state.search = '';
  state.conFilters = {team:'',task:'',date:'',floor:''};
  render();
  playPageAnim();
}
function saveProject(p){
  const list = getProjects().slice();
  const idx = list.findIndex(x => String(x.id)===String(p.id));
  if(idx===-1) list.push(p); else list[idx] = {...list[idx], ...p};
  save(LS.projects, list);
  syncWrite('saveProject', {data: list[idx===-1 ? list.length-1 : idx]});
}

async function syncWrite(action, payload){
  // dữ liệu theo công trình: tự gắn công trình đang chọn nếu bản ghi chưa có (bản ghi mới)
  if(SCOPED_ACTION_RE.test(action)){
    const pid = currentProjectId();
    if(payload.data){ if(!payload.data.projectId) payload.data = {...payload.data, projectId:pid}; }
    else if(!payload.projectId) payload.projectId = pid;
  }
  if(!API_URL) return;
  setSyncStatus('syncing');
  const req = Object.assign({actor: currentActorName()}, payload);
  const encodedLen = encodeURIComponent(JSON.stringify(req)).length;
  const attempt = encodedLen < 6000
    ? ()=>apiGetWrite(action, req)
    : ()=>apiPost(action, req); // payload quá dài (VD nhiều ảnh cũ) — gửi 1 lần, không thử lại được
  const result = await withRetry(attempt, encodedLen < 6000 ? [1500, 4000] : []);
  setSyncStatus(result.ok ? 'online' : 'offline');
}
function setSyncStatus(status){
  state.syncStatus = status;
  renderSyncStatus();
}
function normalizeDate(v){
  if(v===''||v==null) return '';
  const s = String(v);
  const isoDt = s.match(/^(\d{4}-\d{2}-\d{2})T/);
  if(isoDt) return isoDt[1];
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const dmy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(dmy) return dmy[3]+'-'+dmy[2].padStart(2,'0')+'-'+dmy[1].padStart(2,'0');
  return s;
}
/* ô nhập ngày dạng chữ dd/mm/yyyy (thay cho <input type="date"> — định dạng hiển thị
   phụ thuộc trình duyệt/hệ điều hành, dễ gây nhầm lẫn khi gõ). Lưu trữ nội bộ vẫn
   dùng ISO yyyy-mm-dd như cũ — chuyển đổi qua lại bằng 2 hàm dưới đây. */
function isoToDmy(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3]+'/'+m[2]+'/'+m[1] : '';
}
function isValidDmy(v, minYear, maxYear){
  const m = String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return false;
  const d = Number(m[1]), mo = Number(m[2]), y = Number(m[3]);
  if(mo<1||mo>12||d<1) return false;
  const minY = minYear!=null ? minYear : Number(DATE_MIN.slice(0,4));
  const maxY = maxYear!=null ? maxYear : Number(DATE_MAX.slice(0,4));
  if(y<minY||y>maxY) return false;
  return d <= new Date(y, mo, 0).getDate(); // ngày cuối tháng thật (tự tính năm nhuận)
}
function onDateMaskInput(el, minYear, maxYear){
  let v = el.value.replace(/\D/g,'').slice(0,8);
  let out = v;
  if(v.length>4) out = v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
  else if(v.length>2) out = v.slice(0,2)+'/'+v.slice(2);
  el.value = out;
  // dùng validity gốc của trình duyệt để báo lỗi ngay khi gõ dở/không hợp lệ — không cần
  // UI báo lỗi riêng, tự động chặn khi bấm Lưu giống các lỗi chặn khác của trình duyệt.
  if(out.length===0) el.setCustomValidity('');
  else if(out.length<10) el.setCustomValidity('Ngày chưa đầy đủ — nhập theo định dạng dd/mm/yyyy.');
  else el.setCustomValidity(isValidDmy(out, minYear, maxYear) ? '' : 'Ngày không hợp lệ.');
}

   (VD: cột ghi "fullname" hay "FullName" đều nhận được đúng như "fullName") */

}

async function syncAllFromServer(){
  if(!API_URL) return;
  setSyncStatus('syncing');
  try{
    const data = await apiGet('all');
    if(data.users){ save(LS.users, normalizeUsers(data.users)); refreshSessionProjects(); }
    if(data.materials) save(LS.materials, normalizeMaterials(data.materials));
    if(data.staffCt) save(LS.staffCt, normalizeStaffCt(data.staffCt));
    // dữ liệu theo công trình: lưu bản đầy đủ, rồi applyProjectScope() tách phần của công trình đang chọn
    if(data.finance) rawSet('finance', normalizeFinance(data.finance));
    if(data.construction) rawSet('construction', normalizeConstruction(data.construction));
    if(data.staffTd) rawSet('staffTd', normalizeStaffTd(data.staffTd));
    if(data.vatTuChinh) rawSet('vatTuChinh', normalizeVatTuChinh(data.vatTuChinh));
    if(data.vatTuPhu) rawSet('vatTuPhu', normalizeVatTuPhu(data.vatTuPhu));
    if(data.congKhauTru) rawSet('conKhauTru', normalizeKhauTru(data.congKhauTru));
    if(data.congPhat) rawSet('conPhat', normalizePhat(data.congPhat));
    if(Array.isArray(data.settings)) applyServerSettings(data.settings);
    if(Array.isArray(data.projects)) save(LS.projects, normalizeProjects(data.projects));
    applyProjectScope();
    if(isAdminSession()) syncPayments();
    setSyncStatus('online');
    state.hasSyncedOnce = true;
    // đang mở form thêm/sửa dở dang (VD người dùng chuyển sang app Camera chụp ảnh rồi quay lại,
    // trình duyệt tự đồng bộ lại khi tab hiện lên) -> KHÔNG render lại, tránh xoá mất lựa chọn/nội
    // dung đang gõ dở (từng bị báo "chọn LTCK lại nhảy sang Công nhật" do form bị vẽ lại giữa chừng).
    // Dữ liệu vẫn đã cập nhật ngầm, chỉ hoãn hiển thị tới khi người dùng đóng form/điều hướng.
    if(!anyFormOpen()) render();
  }catch(err){
    setSyncStatus('offline');
    state.hasSyncedOnce = true;
    if(!anyFormOpen()) render();
  }
}

/* "công" = quy đổi từ số công nhân buổi sáng + buổi chiều, có thể lẻ .5 (nửa công) */
function formatCong(v){
  const r = Math.round((Number(v)||0)*2)/2;
  return (r % 1 === 0) ? String(r) : r.toFixed(1);
}
/* mã số dòng mới — với dữ liệu theo công trình phải xét cả các công trình KHÁC (bản đầy đủ),
   nếu chỉ xét danh sách đang hiển thị sẽ trùng id với dòng của công trình khác và ghi đè lên nó. */
function uid(list, lsKey){
  let max = list.length ? Math.max(...list.map(x=>Number(x.id)||0)) : 0;
  const raw = lsKey ? rawGet(lsKey) : null;
  if(raw) raw.forEach(r => { const n = Number(r.id)||0; if(n>max) max = n; });
  return max+1;
}
/* định dạng số tiền có dấu phẩy ngăn cách hàng nghìn cho dễ nhìn (VD: 1,563,293,225).
   Dùng cho các ô nhập tiền/lương — input kiểu text (không phải number) để trình duyệt
   không chặn ký tự dấu phẩy. Khi lưu, luôn bỏ dấu phẩy trước khi chuyển thành số. */
function formatThousands(v){
  const digits = String(v==null?'':v).replace(/\D/g,'');
  return digits ? Number(digits).toLocaleString('en-US') : '';
}
function onMoneyInput(el){
  const digits = el.value.replace(/\D/g,'');
  el.value = digits ? Number(digits).toLocaleString('en-US') : '';
}
function parseMoney(v){ return Number(String(v||'').replace(/\D/g,''))||0; }
/* Link Drive trả về từ Code.gs (file.getUrl()) là link "xem" dạng trang HTML
   (.../file/d/ID/view...) — trình duyệt không hiển thị được link này trong thẻ <img>.
   Hàm này chuyển link đó (hoặc link uc?...id=... cũ) thành link ảnh nhúng trực tiếp
   được. Ảnh chưa upload xong (data:...) hoặc link không nhận diện được thì giữ nguyên. */
function driveImgUrl(url){
  if(!url || String(url).startsWith('data:')) return url;
  const m = String(url).match(/\/file\/d\/([^/]+)/) || String(url).match(/[?&]id=([^&]+)/);
  return m ? ('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000') : url;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  const first = parts[0] ? parts[0][0] : '';
  const last = parts.length>1 ? parts[parts.length-1][0] : '';
  return (first+last).toUpperCase();
}
function padSeries(arr){ return arr.length<2 ? [arr[0]||0, arr[0]||0] : arr; }

function resizeImageFile(file, maxDim){
  maxDim = maxDim || 900;
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function openLightbox(source, recordId, idx){

/* chuyển ảnh trước/sau trong CÙNG 1 bản ghi — vòng lặp (ảnh cuối -> ảnh đầu) */
function lightboxStep(delta){
  if(!state.lightbox) return;
  const row = lightboxRow();
  if(!row || !row.photos || !row.photos.length) return;
  const n = row.photos.length;
  state.lightbox.idx = (state.lightbox.idx + delta + n) % n;
  renderLightbox();
}
function renderLightbox(){
  const wrap = document.getElementById('lightbox');
  const row = lightboxRow();
  const photos = (row && row.photos) || [];
  if(!state.lightbox || !photos.length){ wrap.innerHTML=''; return; }
  const idx = Math.min(state.lightbox.idx, photos.length-1);
  const hasMultiple = photos.length>1;
  wrap.innerHTML = `
    <div class="lightbox-backdrop" onclick="closeLightbox()">
      ${hasMultiple?`<button class="lightbox-nav lightbox-prev" onclick="event.stopPropagation(); lightboxStep(-1)" aria-label="Ảnh trước">‹</button>`:''}
      <img src="${driveImgUrl(photos[idx])}" onclick="event.stopPropagation()" alt="Ảnh phóng to">
      ${hasMultiple?`<button class="lightbox-nav lightbox-next" onclick="event.stopPropagation(); lightboxStep(1)" aria-label="Ảnh sau">›</button>`:''}
      ${hasMultiple?`<div class="lightbox-counter">${idx+1} / ${photos.length}</div>`:''}
      <button class="lightbox-close" onclick="closeLightbox()">×</button>
    </div>`;
}

function fmtISO(d){ return d.toISOString().slice(0,10); }
function computePeriodRange(period){
  const today = new Date();
  let from, to;
  if(period==='ngay'){ from=today; to=today; }
  else if(period==='tuan'){
    const dow = (today.getDay()+6)%7;
    from = new Date(today); from.setDate(today.getDate()-dow);
    to = new Date(from); to.setDate(from.getDate()+6);
  } else {
    from = new Date(today.getFullYear(), today.getMonth(), 1);
    to = new Date(today.getFullYear(), today.getMonth()+1, 0);
  }
  return { from: fmtISO(from), to: fmtISO(to) };
}
function conPeriodPreset(period){
  const r = computePeriodRange(period);
  state.tqPeriod = period;
  state.tqFrom = r.from;
  state.tqTo = r.to;
}

function khoStockSummary(rows, nameKey){
  const map = {};
  rows.forEach(r=>{
    const name = r[nameKey];
    if(!name) return;
    if(!map[name]) map[name] = { name, unit:r.unit, nhap:0, xuat:0 };
    if(r.direction==='xuat') map[name].xuat += (r.quantity||0);
    else map[name].nhap += (r.quantity||0);
  });
  return Object.values(map).map(m=>({...m, ton: m.nhap - m.xuat}));
}

/* ---------- phân trang dùng chung cho các bảng dữ liệu ---------- */
function paginate(rows, key, pageSize){
  pageSize = pageSize || 10;
  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total/pageSize));
  let page = state.pagination[key] || 1;
  if(page > totalPages) page = totalPages;
  if(page < 1) page = 1;
  state.pagination[key] = page;
  const start = (page-1)*pageSize;
  return { pageRows: rows.slice(start, start+pageSize), page, totalPages, total, pageSize };
}
function setPage(key, page){ state.pagination[key]=page; render(); }
function paginationBar(key, pg){
  if(pg.total===0) return '';
  const startN = (pg.page-1)*pg.pageSize+1;
  const endN = Math.min(pg.page*pg.pageSize, pg.total);
  return `
  <div class="pagination-bar">
    <span class="pagination-info">${startN}–${endN} / ${pg.total}</span>
    <div class="pagination-controls">
      <button class="pagination-btn" onclick="setPage('${key}', ${pg.page-1})" ${pg.page<=1?'disabled':''}>‹</button>
      <span class="pagination-page">Trang ${pg.page}/${pg.totalPages}</span>
      <button class="pagination-btn" onclick="setPage('${key}', ${pg.page+1})" ${pg.page>=pg.totalPages?'disabled':''}>›</button>
    </div>
  </div>`;
}

/* so sánh cùng kỳ tháng trước — invertSentiment=true khi "tăng" là điều không mong muốn (VD chi phí) */
function pctBadge(curr, prev, invertSentiment){
  if(prev===0){
    if(curr===0) return { text:'0%', dir:null };
    return { text:'Mới', dir: invertSentiment?'down':'up' };
  }
  const pct = Math.round(((curr-prev)/Math.abs(prev))*100);
  const arrowUp = pct>=0;
  const dir = invertSentiment ? (arrowUp?'down':'up') : (arrowUp?'up':'down');
  return { text:(arrowUp?'▲ ':'▼ ')+Math.abs(pct)+'%', dir };
}
function mountSparklines(list){
  state.charts.kpis.forEach(c=>{ if(c) c.destroy(); });
  state.charts.kpis = list.map(item=>{
    const el = document.getElementById(item.id);
    if(!el) return null;
    const data = padSeries(item.data);
    return new Chart(el, {
      type:'line',
      data:{ labels:data.map((_,i)=>i), datasets:[{ data, borderColor:'rgba(255,255,255,.95)', backgroundColor:'rgba(255,255,255,.16)', fill:true, tension:.4, pointRadius:0, borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{enabled:false}}, scales:{ x:{display:false}, y:{display:false} } }
    });
  });
}

/* mật khẩu lưu dạng SHA-256 hash (không lưu chữ thường) — hash ngay trên trình duyệt
   trước khi lưu localStorage/gửi lên Sheets. Tài khoản cũ còn mật khẩu dạng thường
   (từ trước khi có tính năng này) sẽ được tự nâng cấp lên hash ngay lần đăng nhập
   thành công tiếp theo, không cần người dùng làm gì. */
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function looksHashed(pw){ return /^[a-f0-9]{64}$/.test(String(pw||'')); }

async function doLogin(e, wantModule){
  e.preventDefault();
  const f = e.target;
  const username = f.username.value.trim();
  const password = f.password.value;
  const users = load(LS.users, []);
  const idx = users.findIndex(x=>x.username===username);
  let u = idx!==-1 ? users[idx] : null;
  if(u){
    if(looksHashed(u.password)){
      if((await sha256Hex(password)) !== u.password) u = null;
    } else if(u.password === password){
      const hash = await sha256Hex(password);
      users[idx] = {...u, password:hash};
      save(LS.users, users);
      syncWrite('saveUser', {data: users[idx]});
      u = users[idx];
    } else {
      u = null;
    }
  }
  if(!u){ state.err.denied='Sai tên đăng nhập hoặc mật khẩu.'; render(); return false; }
  mergeScopedBack(); // tài khoản mới có thể được xem công trình khác tài khoản trước
  setSession({username:u.username, role:u.role, modules:parseModules(u.module), fullName:u.fullName, projects:parseModules(u.projects)});
  applyProjectScope();
  if(u.role==='admin') syncPayments(); else clearPaymentsCache();
  if(wantModule && !canAccess(wantModule)){
    state.err.denied = `Tài khoản "${u.fullName}" không có quyền truy cập mục "${MODULES[wantModule].label}".`;
  } else {
    state.err.denied = null;
  }
  render();
  playPageAnim();
  return false;
}

function financeCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.finance, []);
  const payload = {
    type: f.type.value,
    category: f.category.value.trim(),
    amount: parseMoney(f.amount.value),
    date: normalizeDate(f.date.value),
    note: f.note.value.trim()
  };
  if(state.edit.tai_chinh){
    payload.id = state.edit.tai_chinh;
    const idx = rows.findIndex(r=>r.id===state.edit.tai_chinh);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows, 'finance');
    rows.push(payload);
  }
  save(LS.finance, rows);
  syncWrite('saveFinance', {data: payload});
  state.edit.tai_chinh = null;
  state.formOpen.tai_chinh = false;
  render();
}

function kvtChinhCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.vatTuChinh, []);
  const materialSel = f.material.value;
  const isOther = materialSel === 'Khác';
  const material = isOther ? f.materialOther.value.trim() : materialSel;
  const unitSel = f.unit.value;
  const unit = unitSel === 'Khác' ? f.unitOther.value.trim() : unitSel;
  const direction = f.direction.value;
  const isBrick = isBrickMaterial(material);
  const payload = {
    date:normalizeDate(f.date.value), direction, material, unit,
    quantity: Math.max(0, Number(f.quantity.value)||0),
    pallets: isBrick ? Math.max(0, Number(f.pallets.value)||0) : 0,
    team: f.team.value.trim(),
    note: f.note.value.trim(),
    photos: state.khoPhotoDraft.slice()
  };
  if(state.edit.kho){
    payload.id = state.edit.kho;
    const idx = rows.findIndex(r=>r.id===state.edit.kho);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows, 'vatTuChinh');
    rows.push(payload);
  }
  const ok = save(LS.vatTuChinh, rows);
  if(!ok){
    state.err.kho = 'Không thể lưu — bộ nhớ trình duyệt đã đầy. Hãy xoá bớt ảnh hoặc bản ghi cũ rồi thử lại.';
    render();
    return;
  }
  state.err.kho = null;
  syncWithPhotos('saveVatTuChinh', 'vattu_chinh', payload);
  state.edit.kho=null; state.formOpen.kho=false; state.khoFormDraft=null; render();
}
/* nhận diện vật tư từ ảnh phiếu vừa chụp bằng AI (Claude) — chỉ điền sẵn form, không tự lưu.
   Chạy qua Code.gs (POST ảnh -> lưu tạm kết quả -> đọc lại qua GET) để không lộ khoá API ra
   trình duyệt và tránh giới hạn CORS/độ dài URL của Apps Script Web App. */
async function analyzeKhoPhotoWithAi(){
  if(!API_URL){ state.err.kho = 'Tính năng AI cần kết nối server, không dùng được ở bản thử cục bộ.'; render(); return; }
  const photo = (state.khoPhotoDraft||[]).find(p=>p.startsWith('data:'));
  if(!photo){ state.err.kho = 'Vui lòng thêm ảnh phiếu vật tư (ảnh vừa chụp/chọn, chưa lưu) trước khi nhận diện.'; render(); return; }
  state.khoAiAnalyzing = true; state.err.kho = null; render();
  try{
    const [meta, b64] = photo.split(',');
    const mimeType = (meta.match(/data:(.*?);base64/)||[])[1] || 'image/jpeg';
    const requestId = 'ai'+Date.now()+Math.random().toString(36).slice(2,8);
    await apiPost('analyzeMaterialPhoto', {
      requestId, base64:b64, mimeType,
      materialOptions: KHO_MATERIALS.map(m=>m.label), unitOptions: UNIT_OPTIONS
    });
    const res = await apiGetParams('aiResult', { requestId });
    if(res.status==='success' && res.result && res.result.found!==false){
      applyAiMaterialResult(res.result);
    } else {
      state.err.kho = (res.result&&res.result.found===false) ? 'Không nhận ra đây là phiếu/ảnh vật tư, vui lòng nhập tay.' : (res.message || 'Không nhận diện được ảnh này, vui lòng nhập tay.');
    }
  }catch(err){
    state.err.kho = 'Lỗi khi gọi AI: ' + err.message;
  }
  state.khoAiAnalyzing = false; render();
}
function applyAiMaterialResult(r){
  const isKnownMaterial = r.materialMatched && KHO_MATERIALS.some(m=>m.label===r.materialMatched);
  const rawUnit = String(r.unit||'').trim();
  state.khoFormDraft = {
    direction: r.direction==='xuat' ? 'xuat' : 'nhap',
    date: r.date ? normalizeDate(r.date) : '',
    material: isKnownMaterial ? r.materialMatched : 'Khác',
    materialOther: isKnownMaterial ? '' : String(r.material||'').trim(),
    unit: UNIT_OPTIONS.includes(rawUnit) ? rawUnit : (rawUnit ? 'Khác' : ''),
    unitOther: UNIT_OPTIONS.includes(rawUnit) ? '' : rawUnit,
    quantity: (r.quantity!=null && r.quantity!=='') ? Number(r.quantity) : '',
    pallets: (r.pallets!=null && r.pallets!=='') ? Number(r.pallets) : '',
    team: String(r.team||'').trim(),
    note: '[AI nhận diện — vui lòng kiểm tra lại]' + (r.note ? ' ' + r.note : '')
  };
}

function khoChinhBucketKey(dateStr, period){
  if(period==='thang') return String(dateStr).slice(0,7);
  if(period==='tuan'){
    const d = new Date(dateStr);
    if(isNaN(d)) return dateStr;
    const dow = (d.getDay()+6)%7;
    d.setDate(d.getDate()-dow);
    return d.toISOString().slice(0,10);
  }
  return dateStr;
}
function khoChinhBucketLabel(key, period){
  if(period==='thang'){
    const [y,m] = key.split('-');
    return 'Th'+Number(m)+'/'+y;
  }
  if(period==='tuan') return 'Tuần '+vdate(key);
  return vdate(key);
}
function khoChinhTrendChart(allRows, period, materials){
  (state.charts.khoChinhTrendList||[]).forEach(c=>c.destroy());
  state.charts.khoChinhTrendList = [];
  const ink = getComputedStyle(document.body).getPropertyValue('--muted').trim();
  const nhapRows = allRows.filter(r=>r.direction==='nhap' && r.material && r.date);
  materials.forEach((m, i)=>{
    const el = document.getElementById('khoChinhTrendChart_'+i);
    if(!el) return;
    const matRows = nhapRows.filter(r=>r.material===m);
    const byBucket = {};
    matRows.forEach(r=>{
      const key = khoChinhBucketKey(r.date, period);
      byBucket[key] = (byBucket[key]||0) + (r.quantity||0);
    });
    const buckets = Object.keys(byBucket).sort();
    const color = CHART_PALETTE[i%CHART_PALETTE.length];
    const chart = new Chart(el, {
      type:'line',
      data:{
        labels: buckets.map(k=>khoChinhBucketLabel(k, period)),
        datasets:[{
          label: m,
          data: buckets.map(k=>byBucket[k]),
          borderColor: color, backgroundColor: color+'2e',
          tension:.35, pointRadius:3, borderWidth:2, fill:true
        }]
      },
      options:{
        maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{
          x:{ ticks:{color:ink, font:{size:10.5}}, grid:{color:'rgba(255,255,255,.06)'} },
          y:{ beginAtZero:true, ticks:{color:ink, precision:0, font:{size:10.5}}, grid:{color:'rgba(255,255,255,.08)'} }
        }
      }
    });
    state.charts.khoChinhTrendList.push(chart);
  });
}

function khoPhuTrendPeriodChange(period){ state.khoPhuTrendPeriod = period; renderKhoPhu(); }
function khoPhuTrendChart(allRows, period){
  const el = document.getElementById('khoPhuTrendChart');
  if(!el) return;
  if(state.charts.khoPhuTrend) state.charts.khoPhuTrend.destroy();
  const ink = getComputedStyle(document.body).getPropertyValue('--muted').trim();
  const nhapRows = allRows.filter(r=>r.direction==='nhap' && r.itemName && r.date);
  const items = [...new Set(nhapRows.map(r=>r.itemName))];
  const byItemBucket = {};
  items.forEach(m=>byItemBucket[m]={});
  const bucketSet = new Set();
  nhapRows.forEach(r=>{
    const key = khoChinhBucketKey(r.date, period);
    bucketSet.add(key);
    byItemBucket[r.itemName][key] = (byItemBucket[r.itemName][key]||0) + (r.quantity||0);
  });
  const buckets = [...bucketSet].sort();
  state.charts.khoPhuTrend = new Chart(el, {
    type:'line',
    data:{
      labels: buckets.map(k=>khoChinhBucketLabel(k, period)),
      datasets: items.map((m,i)=>({
        label: m,
        data: buckets.map(k=>byItemBucket[m][k]||0),
        borderColor: CHART_PALETTE[i%CHART_PALETTE.length],
        backgroundColor: CHART_PALETTE[i%CHART_PALETTE.length],
        tension:.35, pointRadius:3, borderWidth:2, fill:false
      }))
    },
    options:{
      maintainAspectRatio:false,
      plugins:{ legend:{ display:true, position:'bottom', labels:{color:ink, boxWidth:10, font:{size:10.5}} } },
      scales:{
        x:{ ticks:{color:ink}, grid:{color:'rgba(255,255,255,.06)'} },
        y:{ beginAtZero:true, ticks:{color:ink, precision:0}, grid:{color:'rgba(255,255,255,.08)'} }
      }
    }
  });
}
/* ---- tab: Vật tư phụ (hàng phát sinh, có đơn giá) ---- */
function kvtPhuCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.vatTuPhu, []);
  const direction = f.direction.value;
  const payload = {
    date:normalizeDate(f.date.value), direction,
    itemName: f.itemName.value.trim(),
    unit: f.unit.value.trim(),
    quantity: Math.max(0, Number(f.quantity.value)||0),
    price: direction==='nhap' ? parseMoney(f.price.value) : 0,
    team: direction==='xuat' ? f.team.value.trim() : '',
    note: f.note.value.trim(),
    photos: state.khoPhotoDraft.slice()
  };
  if(state.edit.kho){
    payload.id = state.edit.kho;
    const idx = rows.findIndex(r=>r.id===state.edit.kho);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows, 'vatTuPhu');
    rows.push(payload);
  }
  const ok = save(LS.vatTuPhu, rows);
  if(!ok){
    state.err.kho = 'Không thể lưu — bộ nhớ trình duyệt đã đầy. Hãy xoá bớt ảnh hoặc bản ghi cũ rồi thử lại.';
    render();
    return;
  }
  state.err.kho = null;
  syncWithPhotos('saveVatTuPhu', 'vattu_phu', payload);
  state.edit.kho=null; state.formOpen.kho=false; render();
}
function kvtPhuEdit(id){
  state.edit.kho=id; state.formOpen.kho=true;
  const row = load(LS.vatTuPhu, []).find(r=>r.id===id);
  state.khoPhotoDraft = row && row.photos ? row.photos.slice() : [];
  render();
}
function kvtPhuDelete(id){
  save(LS.vatTuPhu, load(LS.vatTuPhu,[]).filter(r=>r.id!==id));
  syncWrite('deleteVatTuPhu', {id});
  state.confirmId=null; render();
}

/* gửi 1 bản ghi có kèm ảnh lên Apps Script — ảnh mới (data:) upload lên Drive, ảnh cũ (http) giữ nguyên link.
   Dùng chung cho Thi công, Vật tư chính, Vật tư phụ. */
async function syncWithPhotos(action, filePrefix, payload){
  if(!API_URL) return;
  const photos = payload.photos||[];
  const existing = photos.filter(p=>!p.startsWith('data:'));
  const fresh = photos.filter(p=>p.startsWith('data:'));
  const newPhotos = fresh.map(dataUrl=>{
    const [meta, b64] = dataUrl.split(',');
    const mimeType = (meta.match(/data:(.*?);base64/)||[])[1] || 'image/jpeg';
    return { base64:b64, mimeType, fileName:filePrefix+'_'+payload.id+'_'+Date.now()+'.jpg' };
  });
  const dataOut = {...payload, photos: existing.join(','), projectId: payload.projectId || currentProjectId()};
  const actor = currentActorName();
  setSyncStatus('syncing');
  if(newPhotos.length){
    // có ảnh mới (base64) — payload quá dài để đi qua GET, gửi 1 lần qua POST, không thử lại được
    apiPost(action, { data: dataOut, newPhotos, actor })
      .then(res=>{
        setSyncStatus(res && res.status==='success' ? 'online' : 'offline');
        // ảnh base64 vừa gửi đi vẫn còn nằm nguyên trong bộ nhớ tạm (localStorage) của máy —
        // nếu không dọn, mỗi lần thêm ảnh mới sẽ làm bộ nhớ đầy dần cho tới khi không lưu được nữa.
        // Đồng bộ lại toàn bộ ngay sau khi ảnh upload xong để thay base64 bằng link Drive gọn nhẹ.
        syncAllFromServer();
      })
      .catch(()=> setSyncStatus('offline'));
  } else {
    const result = await withRetry(()=>apiGetWrite(action, { data: dataOut, newPhotos:[], actor }), [1500, 4000]);
    setSyncStatus(result.ok ? 'online' : 'offline');
  }
}

function phatCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const team = conReadTeam(f, 'team');
  if(!team){ subFormError(f,'Vui lòng nhập tên tổ đội.'); return; }
  const rows = load(LS.conPhat, []);
  const payload = {
    date:normalizeDate(f.date.value), team, quantity:Math.max(0, Number(f.quantity.value)||0),
    amount:parseMoney(f.amount.value), note:f.note.value.trim(), reportedBy:f.reportedBy.value.trim(), photos: state.phatPhotoDraft.slice()
  };
  if(state.edit.con_phat){
    payload.id = state.edit.con_phat;
    const idx = rows.findIndex(r=>r.id===state.edit.con_phat);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows, 'conPhat');
    rows.push(payload);
  }
  if(!save(LS.conPhat, rows)){ subFormError(f, SUB_SAVE_FULL_MSG); return; }
  syncWithPhotos('savePhat', 'phat', payload);
  state.err.phat=null; state.edit.con_phat=null; state.formOpen.con_phat=false; render();
}
function phatEdit(id){
  const row = load(LS.conPhat, []).find(r=>r.id===id);
  state.phatPhotoDraft = row && row.photos ? row.photos.slice() : [];
  state.edit.con_phat=id; state.formOpen.con_phat=true; state.err.phat=null; render();
}
function phatDelete(id){
  save(LS.conPhat, load(LS.conPhat,[]).filter(r=>r.id!==id));
  syncWrite('deletePhat', {id});
  state.confirmId=null; render();
}

/* tổng hợp tổng công và số ngày thi công theo từng tầng, dùng cho bảng "Tiến độ theo tầng" */
function floorProgressSummary(rows){
  const byFloor = {};
  rows.forEach(r=>{
    // gộp theo tên tầng đã chuẩn hoá — tránh tách "14" (số) và "Tầng 14" (chữ, do dữ liệu
    // cũ nhập tự do trước khi có ô chọn tầng) thành 2 dòng riêng dù cùng là 1 tầng.
    const key = floorDisplayLabel(r.floor) || '(Chưa gán tầng)';
    if(!byFloor[key]) byFloor[key] = { floor:key, workers:0, dates:new Set() };
    byFloor[key].workers += (r.workers||0);
    if(r.date) byFloor[key].dates.add(r.date);
  });
  return Object.values(byFloor)
    .map(f=>({ floor:f.floor, workers:f.workers, days:f.dates.size }))
    .sort((a,b)=>b.workers-a.workers);
}

/* ---- tab: Đội nhóm (tổng hợp theo tổ đội, roster chi tiết ở module Nhân sự Tổ đội) ---- */
async function mergeTeams(){
  const form = document.getElementById('mergeTeamsForm');
  const checked = Array.from(form.querySelectorAll('input[name="mergeTeamPick"]:checked')).map(el=>el.value);
  const target = form.querySelector('input[name="mergeTarget"]').value.trim();
  if(checked.length<2){ state.mergeTeamMsg={ok:false,text:'Chọn ít nhất 2 tên tổ đội để gộp.'}; render(); return; }
  if(!target){ state.mergeTeamMsg={ok:false,text:'Nhập tên chung sau khi gộp.'}; render(); return; }
  state.mergeTeamMsg = {ok:true, text:'Đang gộp...'};
  render();
  const conRows = load(LS.construction, []);
  const conChanged = [];
  const conNew = conRows.map(r=>{
    if(checked.includes(r.team) && r.team!==target){ const nr={...r, team:target}; conChanged.push(nr); return nr; }
    return r;
  });
  save(LS.construction, conNew);
  const staffRows = load(LS.staffTd, []);
  const staffChanged = [];
  const staffNew = staffRows.map(r=>{
    if(checked.includes(r.team) && r.team!==target){ const nr={...r, team:target}; staffChanged.push(nr); return nr; }
    return r;
  });
  save(LS.staffTd, staffNew);
  for(const r of conChanged){ await syncWithPhotos('saveConstruction','thi_cong', r); }
  for(const r of staffChanged){ await syncWrite('saveStaffTd', {data:r}); }
  state.mergeTeamMsg = {ok:true, text:`Đã gộp ${conChanged.length} báo cáo thi công và ${staffChanged.length} công nhân vào tổ "${target}".`};
  render();
}

function staffCtCreateOrUpdate(e){
  e.preventDefault();
  const f = e.target;
  const rows = load(LS.staffCt, []);
  const payload = {
    name:f.name.value.trim(), position:f.position.value.trim(), phone:f.phone.value.trim(),
    startDate:normalizeDate(f.startDate.value), salary:parseMoney(f.salary.value), status:f.status.value, note:f.note.value.trim(),
    dob:normalizeDate(f.dob.value), project:f.project.value.trim()
  };
  if(state.edit.nhansu_ct){
    payload.id = state.edit.nhansu_ct;
    const idx = rows.findIndex(r=>r.id===state.edit.nhansu_ct);
    rows[idx] = {...rows[idx], ...payload};
  } else {
    payload.id = uid(rows);
    rows.push(payload);
  }
  save(LS.staffCt, rows);
  syncWrite('saveStaffCt', {data: payload});
  state.edit.nhansu_ct=null; state.formOpen.nhansu_ct=false; render();
}

async function changePasswordSubmit(e){
  e.preventDefault();
  const f = e.target;
  const s = getSession();
  const users = load(LS.users, []);
  const idx = users.findIndex(u=>u.username===s.username);
  if(idx===-1){ state.err.pwd='Không tìm thấy tài khoản.'; state.pwdOk=false; render(); return false; }
  const current = f.currentPassword.value;
  const next = f.newPassword.value;
  const confirm = f.confirmPassword.value;
  const stored = users[idx].password;
  const currentOk = looksHashed(stored) ? (await sha256Hex(current))===stored : stored===current;
  if(!currentOk){ state.err.pwd='Mật khẩu hiện tại không đúng.'; state.pwdOk=false; render(); return false; }
  if(next.length < 4){ state.err.pwd='Mật khẩu mới cần ít nhất 4 ký tự.'; state.pwdOk=false; render(); return false; }
  if(next !== confirm){ state.err.pwd='Xác nhận mật khẩu mới không khớp.'; state.pwdOk=false; render(); return false; }
  users[idx] = {...users[idx], password: await sha256Hex(next)};
  save(LS.users, users);
  syncWrite('saveUser', {data: users[idx]});
  state.err.pwd = null;
  state.pwdOk = true;
  render();
  return false;
}

async function adminCreateUser(e){
  e.preventDefault();
  const f = e.target;
  const users = load(LS.users, []);
  const username = f.username.value.trim();
  if(users.some(u=>u.username===username)){ state.err.admin='Tên đăng nhập đã tồn tại.'; render(); return false; }
  const modules = Array.from(f.querySelectorAll('input[name="modules"]:checked')).map(el=>el.value);
  if(modules.length===0){ state.err.admin='Chọn ít nhất 1 module được phép truy cập.'; render(); return false; }
  const role = f.role.value==='viewer' ? 'viewer' : 'editor';
  const projects = Array.from(f.querySelectorAll('input[name="projects"]:checked')).map(el=>el.value);
  const newUser = { username, password: await sha256Hex(f.password.value), role, module:modules.join(','), fullName:f.fullName.value.trim(), projects:projects.join(',') };
  users.push(newUser);
  save(LS.users, users);
  syncWrite('saveUser', {data: newUser});
  state.err.admin=null;
  render();
  return false;
}
function adminDeleteUser(username){
  save(LS.users, load(LS.users,[]).filter(u=>u.username!==username));
  syncWrite('deleteUser', {username});

}
function adminToggleEditModules(username){

function adminSaveUserModules(e, username){
  e.preventDefault();
  const f = e.target;
  const modules = Array.from(f.querySelectorAll('input[name="modules"]:checked')).map(el=>el.value);
  const role = f.role.value==='viewer' ? 'viewer' : 'editor';
  const projects = Array.from(f.querySelectorAll('input[name="projects"]:checked')).map(el=>el.value);
  const users = load(LS.users, []);
  const idx = users.findIndex(u=>u.username===username);
  if(idx===-1) return false;

  render();
  return false;
}

function adminSaveProject(e){
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  if(!name){ state.err.project='Nhập tên công trình.'; render(); return false; }
  const startDmy = f.startDate.value.trim();
  if(startDmy && !isValidDmy(startDmy)){ state.err.project='Ngày khởi công không hợp lệ (dd/mm/yyyy).'; render(); return false; }
  const all = getProjects();
  const dup = all.find(p => p.name.toLowerCase()===name.toLowerCase() && String(p.id)!==String(state.editingProjectId||''));
  if(dup){ state.err.project='Đã có công trình tên "'+dup.name+'".'; render(); return false; }
  const isNew = !state.editingProjectId || state.editingProjectId==='new';
  const id = isNew ? String(all.reduce((m,p)=>Math.max(m, Number(p.id)||0), 0)+1) : String(state.editingProjectId);
  const old = all.find(p=>String(p.id)===id) || {};
  saveProject({ ...old, id, name, location:f.location.value.trim(), startDate: startDmy ? normalizeDate(startDmy) : '',
    status: f.status.value==='done' ? 'done' : 'active', note:f.note.value.trim(), tinhCongTu: f.tinhCongTu.value });
  if(id===currentProjectId()) applyProjectScope(); // cập nhật ngày khởi công/địa điểm đang hiển thị
  state.editingProjectId = null; state.err.project = null;
  render();
  return false;
}

/* =====================================================================
   THANH TOÁN TỔ ĐỘI (chỉ Quản trị viên) — bill khối lượng theo tháng, sổ tạm ứng,
   tiền công thực tế/công, hạn mức được ứng, so sánh các tổ.
   Dữ liệu (tab BillToDoi, TamUng) KHÔNG nằm trong gói "all" gửi cho mọi máy — chỉ tải
   riêng (action "payments") khi tài khoản Quản trị đăng nhập, xoá khỏi máy khi đăng xuất.
   ===================================================================== */
const PAY_KEY = 'sct_payments';
const PAY_ICON = '<rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/>';
function isAdminSession(){ const s = getSession(); return !!(s && s.role==='admin'); }
function payLoad(){ const p = load(PAY_KEY, null) || {}; return { bills:p.bills||[], advances:p.advances||[] }; }
function paySave(p){ return save(PAY_KEY, p); }
/* xoá dữ liệu tiền tổ đội khỏi máy (đăng xuất / đổi sang tài khoản không phải Quản trị) — chỉ khi
   đang nối Sheets thật (đăng nhập Quản trị lại sẽ tải về); bản chạy thử cục bộ không có server nên giữ lại */
function clearPaymentsCache(){ if(!API_URL) return; try{ localStorage.removeItem(PAY_KEY); }catch(e){} }
function payUid(list){ return list.length ? Math.max(...list.map(x=>Number(x.id)||0))+1 : 1; }
function normalizePeriod(v){
  const s = String(v==null?'':v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})/); if(m) return m[1]+'-'+m[2].padStart(2,'0');
  m = s.match(/^(\d{1,2})\/(\d{4})$/); if(m) return m[2]+'-'+m[1].padStart(2,'0');
  return s;
}
function periodLabel(p){ const m = String(p||'').match(/^(\d{4})-(\d{2})$/); return m ? 'T'+Number(m[2])+'/'+m[1] : (p||'—'); }
function normalizeBills(rows){
  return rows.map(r => {
    let items = [];
    try{ items = JSON.parse(String(pick(r,'items')||'[]')); }catch(e){ items = []; }
    const period = normalizePeriod(pick(r,'period'));
    return { id:Number(pick(r,'id'))||0, projectId:String(pick(r,'projectId')||''), team:String(pick(r,'team')||''),
      period, periodFrom: normalizePeriod(pick(r,'periodFrom')) || period, ky:String(pick(r,'ky')||''),
      category:String(pick(r,'category')||''), leader:String(pick(r,'leader')||''),
      date:normalizeDate(pick(r,'date')), items:Array.isArray(items)?items:[],
      total:Number(pick(r,'total'))||0, note:String(pick(r,'note')||''), fileName:String(pick(r,'fileName')||''), createdBy:String(pick(r,'createdBy')||'') };
  });
}
/* tên kỳ hiển thị: "Kỳ 5 · T10/2026" ; kỳ nhiều tháng: "Kỳ 1 · T5–T6/2026" */
function kyLabel(b){
  const from = b.periodFrom || b.period, to = b.period;
  const mf = String(from).match(/^(\d{4})-(\d{2})$/), mt = String(to).match(/^(\d{4})-(\d{2})$/);
  let months = periodLabel(to);
  if(mf && mt && from!==to) months = mf[1]===mt[1] ? 'T'+Number(mf[2])+'–T'+Number(mt[2])+'/'+mt[1] : periodLabel(from)+'–'+periodLabel(to);
  return (b.ky ? b.ky+' · ' : '') + months;
}
function teamDisplay(team, leader){ return leader && leader!==team ? team+' ('+leader+')' : team; }
function normalizeAdvances(rows){
  return rows.map(r => ({ id:Number(pick(r,'id'))||0, projectId:String(pick(r,'projectId')||''), team:String(pick(r,'team')||''),
    date:normalizeDate(pick(r,'date')), amount:Number(pick(r,'amount'))||0, note:String(pick(r,'note')||''), reportedBy:String(pick(r,'reportedBy')||'') }));
}
async function syncPayments(){
  if(!API_URL || !isAdminSession()) return;
  try{
    const d = await apiGet('payments');
    if(d && !d.error){
      paySave({ bills:normalizeBills(d.bills||[]), advances:normalizeAdvances(d.advances||[]) });
      if(state.view==='thanh_toan' && !anyFormOpen()) render();
    }
  }catch(e){ /* giữ dữ liệu đang có trên máy */ }
}

/* tổng hợp theo tổ cho công trình đang chọn. period = 'yyyy-mm' (kỳ đó + lũy kế tới hết kỳ đó)
   hoặc '' (toàn bộ). Công khoán = tổng công trong Báo cáo hàng ngày, KHÔNG tính loại việc
   "Công nhật" (công nhật thanh toán riêng). Điều chỉnh = công nhật được hưởng (tổ khấu trừ)
   − công nhật bị khấu trừ − phạt thi công. */
/* "tính tiền công/công từ tháng" của công trình (cột tinhCongTu, tab CongTrinh) — bỏ qua các kỳ
   trước khi có đủ Báo cáo quân số, nếu không tiền công/công bị đội lên. Trống = tính mọi kỳ. */
function tinhCongTu(){ const p = currentProject(); return (p && /^\d{4}-\d{2}$/.test(p.tinhCongTu||'')) ? p.tinhCongTu : ''; }
/* period = tháng KẾT THÚC của kỳ đang xem ('yyyy-mm'), '' = toàn bộ. Kỳ có thể gồm nhiều tháng
   (VD Kỳ 1 = T5+T6): công của kỳ = công trong mọi tháng từ periodFrom tới period. */
function teamPaySummary(period){
  const pid = currentProjectId();
  const pay = payLoad();
  const bills = pay.bills.filter(b => rowProjectId(b)===pid);
  const adv = pay.advances.filter(a => rowProjectId(a)===pid);
  const con = load(LS.construction, []).filter(r => r.task!=='Công nhật');
  const kt = load(LS.conKhauTru, []);
  const phat = load(LS.conPhat, []);
  const from = period ? (bills.filter(b=>b.period===period).map(b=>b.periodFrom||b.period).sort()[0] || period) : '';
  const startCong = tinhCongTu();
  const mon = d => String(d||'').slice(0,7);
  const inP  = d => !period || (mon(d)>=from && mon(d)<=period);
  const upTo = d => !period || mon(d)<=period;
  const kyCounted = !period || !startCong || from>=startCong; // kỳ đang xem có đủ quân số để chia công không
  // tháng cuối cùng ĐÃ có bill (trong phạm vi đang xem) — công sau tháng này chưa có bill tương ứng,
  // nếu đem chia sẽ làm tiền công/công bị thấp đi (VD bill tới T10 nhưng quân số đã có tới giữa T11)
  const lastBilled = bills.map(b=>b.period).filter(p => !period || p<=period).sort().pop() || '';
  const teams = [...new Set([...bills.map(b=>b.team), ...adv.map(a=>a.team), ...con.map(r=>r.team)])].filter(Boolean).sort();
  const sum = (arr, f) => arr.reduce((s,x)=>s+(Number(f(x))||0), 0);
  return teams.map(team => {
    const tb = bills.filter(b=>b.team===team), tc = con.filter(r=>r.team===team);
    const latest = tb.slice().sort((a,b)=>(b.period||'').localeCompare(a.period||''))[0] || {};
    const billKy = sum(tb.filter(b=>!period || b.period===period), b=>b.total);
    const billLk = sum(tb.filter(b=>!period || b.period<=period), b=>b.total);
    const conKy = tc.filter(r=>inP(r.date));
    const congKy = sum(conKy, r=>r.workers);
    const congLk = sum(tc.filter(r=>upTo(r.date)), r=>r.workers);
    // phần dùng để chia tiền công/công lũy kế: chỉ các kỳ/tháng từ "tính từ tháng" trở đi
    const billLkCong = sum(tb.filter(b=>(!period || b.period<=period) && (!startCong || (b.periodFrom||b.period)>=startCong)), b=>b.total);
    const congLkCong = sum(tc.filter(r=>upTo(r.date) && (!startCong || mon(r.date)>=startCong) && (!lastBilled || mon(r.date)<=lastBilled)), r=>r.workers);
    const days = new Set(conKy.map(r=>r.date)).size;
    const nguoiBq = days ? congKy/days : 0;
    const daUng = sum(adv.filter(a=>a.team===team && upTo(a.date)), a=>a.amount);
    const phatLk = sum(phat.filter(r=>r.team===team && upTo(r.date)), r=>r.amount);
    const ktTru = sum(kt.filter(r=>r.targetTeam===team && upTo(r.date)), r=>r.amount);
    const ktCong = sum(kt.filter(r=>r.team===team && upTo(r.date)), r=>r.amount);
    const dieuChinh = ktCong - ktTru - phatLk;
    return { team, leader:latest.leader||'', category:latest.category||'', billKy, billLk, congKy, congLk, congLkCong, days, nguoiBq, daUng, phatLk, ktTru, ktCong, dieuChinh,
      conDuocUng: billLk + dieuChinh - daUng,
      tienCongKy: (kyCounted && congKy && billKy) ? billKy/congKy : 0,
      tienCongLk: (congLkCong && billLkCong) ? billLkCong/congLkCong : 0,
      thuNhapNguoi: (kyCounted && nguoiBq) ? billKy/nguoiBq : 0, kyCounted };
  }).filter(r => r.billLk || r.daUng || r.congLk);
}
/* danh sách kỳ để chọn xem: theo các bill đã nhập (mỗi kỳ = tháng kết thúc); chưa có bill thì theo tháng có quân số */
function payPeriodOptions(){
  const pid = currentProjectId();
  const map = {};
  payLoad().bills.filter(b=>rowProjectId(b)===pid).forEach(b => { if(/^\d{4}-\d{2}$/.test(b.period) && !map[b.period]) map[b.period] = kyLabel(b); });
  if(!Object.keys(map).length) load(LS.construction, []).forEach(r => { const m = String(r.date||'').slice(0,7); if(/^\d{4}-\d{2}$/.test(m)) map[m] = periodLabel(m); });
  return Object.keys(map).sort().reverse().map(p => ({ value:p, label:map[p] }));
}
function median(arr){ const a = arr.filter(x=>x>0).sort((x,y)=>x-y); if(!a.length) return 0; const m = Math.floor(a.length/2); return a.length%2 ? a[m] : (a[m-1]+a[m])/2; }
function vndShort(n){ return Math.round(Number(n)||0).toLocaleString('vi-VN'); }

function payTabSwitch(tab){
  state.payTab = tab; state.formOpen.pay_bill=false; state.formOpen.pay_adv=false; state.edit.pay_bill=null; state.edit.pay_adv=null;
  state.billDraft=null; state.billImport=null; state.confirmId=null; render();
}

/* ---- Tổng hợp ---- */
function renderPaySummary(){
  const periods = payPeriodOptions();
  const period = state.payPeriod && periods.some(p=>p.value===state.payPeriod) ? state.payPeriod : '';
  const periodText = period ? (periods.find(p=>p.value===period)||{}).label : '';
  const startCong = tinhCongTu();
  const rows = teamPaySummary(period);
  const med = median(rows.map(r => period ? r.tienCongKy : r.tienCongLk));
  const tot = rows.reduce((a,r)=>({ billKy:a.billKy+r.billKy, billLk:a.billLk+r.billLk, daUng:a.daUng+r.daUng, con:a.con+r.conDuocUng, cong:a.cong+(period?r.congKy:r.congLkCong) }), {billKy:0,billLk:0,daUng:0,con:0,cong:0});
  const overAdv = rows.filter(r=>r.conDuocUng<0);
  const tcFlag = v => {
    if(!med || !v) return '';
    const d = (v-med)/med;
    if(d > 0.3) return `<span class="chip chip-danger" title="Cao hơn ${Math.round(d*100)}% so với mức giữa các tổ — kiểm tra bill có bị đẩy khối lượng, hoặc báo cáo quân số bị thiếu">Cao +${Math.round(d*100)}%</span>`;
    if(d < -0.3) return `<span class="chip chip-progress" title="Thấp hơn ${Math.round(-d*100)}% so với mức giữa các tổ — tổ có thể đang lỗ công, dễ bỏ việc">Thấp ${Math.round(d*100)}%</span>`;
    return '';
  };
  document.getElementById('paySub').innerHTML = `
    <div class="tq-filterbar">
      <span style="font-size:12.5px; color:var(--muted);">Kỳ xem:</span>
      <select onchange="state.payPeriod=this.value; render();" style="border:1px solid var(--line); background:var(--surface-2); color:var(--ink); padding:7px 10px; border-radius:8px; font-size:12.5px; font-family:inherit;">
        <option value="">Toàn bộ (lũy kế đến nay)</option>
        ${periods.map(p=>`<option value="${p.value}" ${p.value===period?'selected':''}>${esc(p.label)} (kỳ + lũy kế đến hết kỳ)</option>`).join('')}
      </select>
      <span style="font-size:12px; color:var(--muted-2); margin-left:auto;">${startCong?`Tiền công/công tính từ <b style="color:var(--ink);">${periodLabel(startCong)}</b> (đủ báo cáo quân số) · `:''}Bill nghiệm thu thường chậm hơn ngày làm → <b style="color:var(--ink);">số lũy kế</b> chính xác hơn từng kỳ.</span>
    </div>
    <div class="kpi-grid">
      ${kpiCard('', 'kpi-blue', period?'Giá trị bill '+(periodText||'kỳ'):'Giá trị bill lũy kế', vndShort(period?tot.billKy:tot.billLk)+' đ', period?'Lũy kế '+vndShort(tot.billLk):'', WALLET_ICON)}
      ${kpiCard('', 'kpi-orange', 'Đã tạm ứng (lũy kế)', vndShort(tot.daUng)+' đ', '', TREND_DOWN_ICON)}
      ${kpiCard('', tot.con<0?'kpi-red':'kpi-green', 'Còn được ứng (tổng)', vndShort(tot.con)+' đ', overAdv.length?overAdv.length+' tổ ứng vượt':'', TREND_UP_ICON)}
      ${kpiCard('', 'kpi-purple', 'Tiền công/công (mức giữa)', med?vndShort(med)+' đ':'—', vndShort(tot.cong)+' công', PERCENT_ICON)}
    </div>
    ${overAdv.length?`<div class="error-msg" style="margin:-4px 0 16px;">⚠ Ứng vượt giá trị đã làm: ${overAdv.map(r=>`<b>${esc(r.team)}</b> (${vndShort(-r.conDuocUng)} đ)`).join(', ')}</div>`:''}
    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>Theo từng tổ đội</h3><span style="font-size:12px; color:var(--muted);">${rows.length} tổ</span></div>
      <div class="tablewrap"><table>
        <thead><tr>
          <th>Tổ đội</th>
          <th>Hạng mục</th>
          ${period?'<th class="num">Bill kỳ</th>':''}
          <th class="num">Bill lũy kế</th>
          <th class="num" title="${period?'Công khoán trong các tháng của kỳ':'Công khoán dùng để tính tiền công: từ tháng bắt đầu tính đến tháng cuối cùng đã có bill'}">Công khoán${period?' (kỳ)':' (đã có bill)'}</th>
          <th class="num">Tiền công/công</th>

          <th class="num">Đã ứng</th>
          <th class="num">Điều chỉnh</th>
          <th class="num">Còn được ứng</th>
        </tr></thead>
        <tbody>
          ${rows.length===0?`<tr class="empty-row"><td colspan="11">Chưa có bill hoặc tạm ứng nào ở công trình này. Thêm ở tab "Bill tổ đội" và "Tạm ứng".</td></tr>`:
          rows.map(r=>{
            const tc = period ? r.tienCongKy : r.tienCongLk;

            return `<tr>
              <td><b>${esc(r.team)}</b>${r.leader&&r.leader!==r.team?`<div style="font-size:11.5px; color:var(--muted);">${esc(r.leader)}</div>`:''}</td>
